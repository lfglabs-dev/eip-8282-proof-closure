  "assumptions": [
    {
      "id": "A-ABSTRACT-TX",
      "status": "OPEN",
      "accepted": true,
      "risk": "Success/revert semantics of Model.userCall/systemCall remain abstract. R4 proves the X-to-Ξ observation wrapper and jumpdest agreement, but its universal endpoint premise XiTransport.EndpointAgrees is still an explicit hypothesis. R5 sharpens the storage part: for every ReachableStorage image, Ξ on the pinned runtime must realise applyUser/applySystem. Neither EndpointAgrees nor that realisation is proved.",
      "justification": "The three registered parents remain CFG-direct foralls plus kill-line traces. R4 transports them to complete-Ξ observations only under EndpointAgrees. R5 proves constructor/call preservation and Model.Reachable entirely on the packed-storage/model side; it never runs Ξ and therefore does not discharge EndpointAgrees.",
      "severity": "HIGH",
      "violation_impact": "Any guarantee linked to this premise must be re-evaluated against assembly/bytecode. Because A-REACHABLE's residual now folds into this entry, a violation here also invalidates the claim that ReachableStorage describes the images the predeploys can actually reach — the containment proofs would remain true but would be about the wrong closure.",
      "validation": "XiTransport.EndpointAgrees is a hypothesis of every conditional R4 transport and is never discharged. Eip8282.Audit.Reachable states that it never runs Ξ; Trust prints axioms for its closure theorems.",
      "removal_path": "Prove EndpointAgrees universally for the pinned runtimes, including that Ξ realises applyUser and applySystem on WellFormed images. R4 already closes the unconditional X-to-Ξ wrapper and jumpdest sublayers."
    },
    {
      "id": "A-REACHABLE",
      "accepted": true,
      "risk": "Residual only. The coverage direction — that every storage image reachable from the specified deployment satisfies the WellFormed/CallHyp guard the three parents quantify over — is now machine-checked inside the packed-storage layer by Eip8282.Audit.Reachable and is no longer assumed. What is still assumed is that the reachability closure used there is the right one: ReachableStorage's transition functions applyUser and applySystem are defined over packed storage, not derived from Ξ, so an image the pinned runtimes can actually produce but applyUser/applySystem cannot is outside the closure. That residual is the realisation gap tracked at HIGH under A-ABSTRACT-TX; it is not a second, independent gap.",
      "justification": "ReachableStorage kind σ bal is an inductive closure whose base ctorStorage is depositPost/exitPost on the empty store — the very post-images ctor_posts_from_empty obtains by running the pinned init bytecode, not posited constants — and whose steps are applyUser (append + count + tail bump) and applySystem (excess/count control write + head/tail drain). Over that closure the following are proved with no new axiom: ctorStorage_wellFormed; ctorStorage_toModel (the ctor post-images are literally Model.initialDeposit / Model.initialExit); applyUser_wellFormed and applySystem_wellFormed (WellFormed is preserved by every step, under two explicit side conditions); ReachableStorage.wellFormed (every reachable image is in the parents' guard); ReachableStorage.model_reachable (toModel carries the closure into Model.Reachable via the model's own constructors); and ReachableStorage.callHyp (a reachable image plus a gas/fuel/caller bound yields the CallHyp the CFG parents consume). P-SUBMIT-1's ∀ parent now carries the WellFormed ∧ Model.Reachable conjunct on ReachableStorage-guarded images directly. Proving the parents over the WellFormed superset rather than over the closure itself is strictly stronger, now that the closure is known to be contained in it.",
      "severity": "LOW",
      "violation_impact": "If applyUser/applySystem do not describe what the pinned runtimes do to storage, then ReachableStorage covers the wrong set of images and the containment proof, while still true, is about the wrong closure. WellFormed still admits images — e.g. astronomically large excess — that no step sequence builds; that over-coverage strengthens rather than weakens the parents and is not the risk here.",
      "validation": "Eip8282.Audit.Reachable: ReachableStorage inductive, ctorStorage_wellFormed, ctorStorage_toModel, ctorStorage_reachable, applyUser_wellFormed, applySystem_wellFormed, toModel_applyUser_eq_userCall, toModel_applySystem, ReachableStorage.wellFormed, ReachableStorage.model_reachable, ReachableStorage.callHyp. #print axioms in Eip8282.Audit.Trust shows these carrying only the three foundational Lean axioms — no native_decide receipt, no project axiom. The two side conditions the preservation lemmas require are explicit constructor arguments and are not hidden: an append needs queueTail + 1 < 2^64 and slotCount + 1 < UInt256.size, and a system call needs slotExcess + slotCount < UInt256.size.",
      "removal_path": "Fully retired by closing A-ABSTRACT-TX: once Ξ on the pinned runtimes is shown to realise applyUser and applySystem on well-formed images, ReachableStorage is the bytecode reachability closure rather than a model of it, and this entry collapses into that correspondence."
    },
    {
      "id": "A-CLASSICAL-CHOICE",
      "accepted": true,
      "risk": "Classical Lean rather than constructive.",
      "justification": "Standard Lean 4 kernel axiom; no project-specific claim rests on computational content of choice.",
      "severity": "LOW",
      "violation_impact": "None for the invariance theorems.",
      "validation": "#print axioms in Eip8282.Audit.Trust.",
      "removal_path": "Not required."
    },
    {
      "id": "A-NATIVE-DECIDE",
      "accepted": true,
      "risk": "The kept Xi trace theorems and the mutant kill-lines are discharged by native_decide, adding one compiler-generated axiom per theorem (<theorem>._native.native_decide.ax_1_1 under Lean 4.31) and with it the Lean compiler and the EVMYulLean interpreter to the trusted base. Scope note: as of EVMYulLean 0ff72b2 this no longer covers the jumpdest tables. D_J_aux is now structurally recursive (fuel = c.size), so deposit_D_J, exit_D_J, depositInit_D_J and exitInit_D_J are closed by decide +kernel, and the validJumps = D_J _ 0 bridges in Eip8282.Audit.Step that the registered forall parents rewrite with are kernel-checked.",
      "justification": "Forced for Xi traces by cost, not by an irreducible definition. Earlier revisions of this entry blamed the opaque @[extern] FFI constants and the partial RLP decoders; that is wrong for this path. Decoding the four pinned images (depositRuntime 628 bytes, depositInit 638, exitRuntime 458, exitInit 503) finds no SHA3, no BLOCKHASH, no call/create opcode and therefore no precompile dispatch, so the evaluator branches naming EvmYul.FFI.keccak256 / sha256 / BLAKE2Compress are never entered - importing them does not make them part of kernel reduction. Eip8282.Audit.EvmRunner.run builds a world and applies EVM.Xi to it directly, so transaction RLP is never decoded and separateListRLP / deserializeRLP (EvmYul/Wheels.lean) are never called. What is actually infeasible is kernel evaluation of the trace itself: each kept trace is a Xi run of up to FUEL = 80000 interpreter steps (DEPOSIT_CAP_FUEL = 300000 for the deposit-cap traces) over EVMYulLean's monad-transformer stack, AccountMap / Std.TreeSet lookups and UInt256 / ByteArray operations, which decide +kernel cannot whnf in practical time or memory while the compiled evaluator runs it at native speed. The alternative is no Xi-level evidence at all. It is not forced for D_J, which is why the jumpdest scans were moved off it.",
      "severity": "MEDIUM",
      "violation_impact": "A Lean compiler or EVMYulLean interpreter bug could make the kept Xi trace facts false while the build stays green. The abstract-model theorems, the jumpdest tables and the CFG-level forall parents' D_J rewrites are unaffected.",
      "validation": "#print axioms in Eip8282.Audit.Trust names exactly which theorems carry it, and separately shows deposit_D_J / exit_D_J / depositInit_D_J / exitInit_D_J / deposit_validJumps_eq_D_J / exit_validJumps_eq_D_J / depositInit_validJumps_eq_D_J / exitInit_validJumps_eq_D_J and the parent-facing validJumps_are_Xi_tables carrying only the three foundational axioms; the P-SUBMIT-1 / P-DRAIN-1 / P-CONTROL-1 bytecode kill-lines show the evaluation is discriminating rather than constant-true.",
      "removal_path": "Done for the jumpdest scans (EVMYulLean 0ff72b2 + decide +kernel). The remaining Xi traces are already decide-able in principle - nothing on their path is opaque or partial - so removal is a performance problem, not a definitional one: make kernel evaluation of an 80000-step Xi run affordable (cheaper interpreter state representations, whnf-friendly UInt256 / ByteArray / AccountMap operations, or shorter pinned traces), or retire the traces entirely by closing A-ABSTRACT-TX so the CFG forall parents carry the bytecode claims without a finite witness. Note that FFI dynlibs remain a build-time requirement regardless, because native_decide compiles and links the whole interpreter."
    },
    {
      "id": "A-EVM-WORLD",
      "accepted": true,
      "risk": "The bytecode layer executes on a synthetic two-account world (predeploy plus caller) with a default block header, not on mainnet state. All three registered parents are CFG-level ∀ under WellFormed / CallHyp — P-SUBMIT-1 WELL_FORMED_FORALL, P-DRAIN-1 CFG_FORALL, P-CONTROL-1 CFG_FORALL — plus the Wave-1/5/6 Ξ traces the kill-lines still refute. They are not finite-trace-only claims and they do not quantify over arbitrary raw storage or mainnet state.",
      "justification": "Xi is the real EVM message-call semantics; only the surrounding world is synthetic. None of the three ∀ parents quantifies over arbitrary raw storage: WellFormed packs slots 0–3 and requires head ≤ tail. The kept Ξ traces are kill-line witnesses at chosen images, not the scope of the registered parents. R5 removes the complementary worry that the WellFormed/CallHyp guard might be too narrow rather than too wide: ReachableStorage.wellFormed and ReachableStorage.callHyp show every image reachable from the pinned ctor post-images satisfies the guard, so the parents are not silently excluding states the predeploys can occupy. The synthetic surrounding world is untouched by that and is why this entry stays HIGH.",
      "severity": "HIGH",
      "violation_impact": "A theorem about an ill-formed storage image, the wrong caller class, or a starved-gas call is not a theorem about the predeploy path the parent names. Kill-line traces still refute mutants of the pinned bytes. The residual is now concentrated in the two-account world and default header rather than in the storage guard.",
      "validation": "Eip8282.Audit.Correspondence.CallHyp and Eip8282.Audit.EvmRunner.worldWith / callEnv are the world construction. audit/guarantees.yaml records evm.scope WELL_FORMED_FORALL (P-SUBMIT-1) and CFG_FORALL (P-DRAIN-1, P-CONTROL-1). Guard coverage: Eip8282.Audit.Reachable.ReachableStorage.wellFormed and .callHyp, with #print axioms lines in Eip8282.Audit.Trust.",
      "removal_path": "Close A-ABSTRACT-TX so the WellFormed ∀ transports to Ξ, or execute against observed mainnet predeploy state."
    },
    {
