      "validation": "The boundary module is compiled and Trust prints axioms for its public closure theorems. Its result is intentionally conditional: universal_iff_endpointClosure proves UniversalXiCorrespondence ↔ UniversalClosure, not either side. UniversalClosure contains TerminationClosure and EndpointClosure; the latter contains ExitAgrees and PostStateAgrees. No theorem in this repository derives either closure component, no complete-Xi native_decide check is used, and no new guarantee or assumption ID is registered.",
      "removal_path": "Replace with a machine-checked correspondence from Model.userCall/systemCall to EvmYul.EVM.Xi on the pinned runtimes. Scope note (R4): the X to Xi layer is closed unconditionally by Eip8282.Audit.XiTransport.observe_Xi_eq_observe_X - a complete Xi message call and the X run it delegates to have the same observation (revert flag and return bytes), because Xi only re-wraps X's success payload and passes revert through; and by XiTransport.Xi_validJumps_eq the jumpdest table Xi derives for itself from the pinned code is the kernel-checked depositJumpdests / exitJumpdests. R4 additionally closes the exit-instruction layer unconditionally: XiTransport.observe_result_exit proves the complete Xi call observes exactly the halting instruction the code run exits on, and XiTransport.exit_op_cases / out_eq_H_return / bytes_eq_nil_of_silent read off EVMYulLean's H that the exit opcode is one of RETURN / REVERT / STOP / SELFDESTRUCT, that RETURN and REVERT publish exactly the requested memory slice (so the output ByteArray is determined rather than universally quantified), and that STOP and SELFDESTRUCT publish nothing. None of these carries native_decide. These reduce the surface the premise must cover but do NOT discharge it: XiTransport.exitAgrees_of_silent closes the two silent-halt branches, XiTransport.pcontrol1_xi_exit_is_RETURN pins P-CONTROL-1's exit opcode to RETURN because a 32-byte fee quote cannot come from a silent halt or a revert, XiTransport.pdrain1_xi_exit_publishes refutes the silent halts for P-DRAIN-1 on a non-empty FIFO window, and XiTransport.psubmit1_exitAgrees_iff shows P-SUBMIT-1's residual is exactly the two EVM-side facts op = REVERT and bytes out = nil with no Model reference. R4 also proves the H side condition rather than assuming it: XiTransport.exit_halting (from EvmYul.EVM.Proof.RunUntil.stop_of_rem_pos) and XiTransport.exit_H (composing it with H_eq_none_iff) show H is some at the exit, so the published bytes are the function XiTransport.haltData post.toMachineState op rather than a quantified ByteArray carried with a side condition, and XiTransport.xiExitTransport now has no hypothesis at all beyond the run. What remains open is strictly the endpoint obligation on the RETURN / REVERT branches: that the memory slice the pinned predeploy publishes there agrees with Model.step on every calldata / value / storage branch, and that it exits by REVERT exactly when the model reverts. No run of the pinned bytecode is proved to reach any particular opcode. The inversion previously recorded here as the next lemma owed is now proved: at the pinned revision b62586650b4f96cc6da25f36574aaa8f329a6420 EvmYul.EVM.Proof supplies the RETURN half only - EvmYul.EVM.Proof.MemoryStep.step_RETURN inverts EvmYul.step .RETURN through EVM.binaryMachineStateOp and H_return_step_RETURN reads the published slice off the resulting post-state - and contains no REVERT counterpart, so R4 supplies both at the layer this file uses. XiTransport.step_REVERT_H_return and XiTransport.step_RETURN_H_return invert EVMYulLean's step at the publishing halts into post.toMachineState.H_return = mid.memory.readWithPadding of the exit's own two stack operands, via a chain of definitional steps through EVM.step, EvmYul.step and EVM.binaryMachineStateOp. XiTransport.haltData_eq_memory_slice lifts that to haltData and XiTransport.bytes_haltData_eq_nil_of_zero_length concludes that a RETURN or REVERT whose length operand is zero publishes no bytes, whatever the offset and whatever memory holds. The byte half of P-SUBMIT-1's residual is therefore proved rather than assumed, and XiTransport.psubmit1_xi_inhibited_reverts_of_zero_length concludes that an inhibited predeploy is observed to revert with no data under no ExitAgrees premise at all - only the EVM-side facts that the run exits on REVERT with a zero length operand. XiTransport.xiSliceTransport bundles the same content with no hypothesis beyond the run and the shape of the operand stack. None of these carries native_decide or a project axiom. This does NOT close the assumption. For P-DRAIN-1 and P-CONTROL-1 the residual is only restated over memory by XiTransport.exitAgrees_iff_memory_slice, which is an iff and so neither strengthens nor weakens it, and XiTransport.pcontrol1_xi_exit_length_ne_zero adds only that a 32-byte fee quote cannot be published by a zero-width slice. What still has no proof is that the pinned runtimes reach any particular exit opcode, what their memory and stack hold when they do, and that the published slice agrees with Model.step on every calldata / value / storage branch. Closing the assumption requires a universal opcode-level proof over the pinned runtimes, not another finite trace. Closing it must also show Xi realises applyUser and applySystem on WellFormed images, which is the R5 residual folded into this entry. R4 additionally settles the width question outright. XiTransport.size_readWithPadding_le and XiTransport.size_readWithPadding invert EvmYul's ByteArray.readWithPadding - which appends ffi.ByteArray.zeroes of the shortfall, computed as a BitVec subtraction through a machine word - to show the published slice has at most, and under mu1.toNat < USize.size exactly, the size its own length operand names, whatever the offset and whatever memory holds; XiTransport.size_readWithPadding_of_lt_two_pow_32 is the platform-independent corollary and XiTransport.natCast_sub_bitvec / toNat_natCast_sub are the machine-word lemmas it needs. XiTransport.length_bytes_haltData_le and XiTransport.length_bytes_haltData lift this to the exit instruction, XiTransport.exitAgrees_length_operand_le and exitAgrees_length_operand transfer it across the residual premise, and XiTransport.xiWidthTransport bundles all four at complete Xi for every kind. The per-parent consequences are XiTransport.psubmit1_exitAgrees_iff_operand, which makes P-SUBMIT-1's residual the pure instruction-level statement op = REVERT and mu1.toNat = 0; XiTransport.pdrain1_returnData with pdrain1_xi_exit_length_ge and pdrain1_xi_exit_length_eq, which pin P-DRAIN-1's length operand to the width of concatReturned of the FIFO window; and XiTransport.pcontrol1_returnData_length with pcontrol1_xi_exit_length_ge_32 and pcontrol1_xi_exit_length_eq_32, which pin P-CONTROL-1's to exactly 32. None carries native_decide or a project axiom. This still does NOT close the assumption. What remains open is, verbatim, the premise ExitAgrees op (haltData post.toMachineState op) (Model.step model mstep), equivalently EndpointAgrees via endpointAgrees_iff_exitAgrees: nothing proves the pinned runtimes reach any particular exit instruction, nor which bytes their memory holds when they do. After R4 the residual is about which bytes are published, not how many. R4 additionally refutes one more exit branch outright. Because Model.systemCall is total - it has no revert constructor - the drain residual cannot be satisfied by a REVERT, which XiTransport.pdrain1_xi_exit_not_REVERT proves with no hypothesis beyond the residual itself. With XiTransport.pdrain1_xi_exit_publishes already refuting the silent halts on a non-empty FIFO window, XiTransport.pdrain1_xi_exit_is_RETURN leaves P-DRAIN-1 with a single surviving exit opcode. On an empty window the residual is not merely narrowed but proved: XiTransport.pdrain1_exitAgrees_of_silent covers the STOP and SELFDESTRUCT branches and XiTransport.pdrain1_exitAgrees_of_zero_length the zero-width RETURN, so XiTransport.pdrain1_xi_empty_window_returns_nothing observes the complete Xi call succeeding with no data under no ExitAgrees premise. This does NOT close the assumption. It removes the revert branch and the empty window from what A-ABSTRACT-TX must cover for P-DRAIN-1; what remains is the non-empty window, where nothing proves the pinned runtime reaches its RETURN nor that the memory slice it publishes there is concatReturned of the capped queue prefix. R4 finally carries the same treatment to the other two parents, on the branches where the abstract side decides the answer without reference to memory. Model.userCall returns .success _ nil for an accepted submission, so XiTransport.psubmit1_exitAgrees_iff_accepted, psubmit1_exitAgrees_of_silent_accepted and psubmit1_exitAgrees_of_zero_length_accepted discharge P-SUBMIT-1's accepting path the same way the inhibited path was discharged, and XiTransport.psubmit1_xi_accepted_returns_nothing observes it at complete Xi with no ExitAgrees premise. Model.userCall reverts an empty-calldata call carrying value before computing the quote, so XiTransport.pcontrol1_exitAgrees_iff_paid, pcontrol1_xi_paid_exit_is_REVERT and pcontrol1_exitAgrees_of_zero_length_paid discharge P-CONTROL-1's paid branch, and XiTransport.pcontrol1_xi_paid_fee_getter_reverts_of_zero_length observes it at complete Xi with no ExitAgrees premise. XiTransport.pcontrol1_exitAgrees_iff additionally states the quoting branch's residual in closed form, which removes the H side condition from the REVERT refutation but is an iff and therefore neither strengthens nor weakens the assumption there. None of these carries native_decide or a project axiom. This does NOT close the assumption. After R4 the branches A-ABSTRACT-TX must still cover are exactly the ones whose abstract answer carries bytes read out of memory: P-DRAIN-1 on a non-empty FIFO window, P-CONTROL-1's 32-byte fee quote, and in every case the fact that the pinned runtime reaches the exit instruction at all. Nothing here proves any run of the pinned bytecode reaches any particular opcode. R4 finally closes the rejected-submission branch and bounds the enumeration. XiTransport.psubmit1_exitAgrees_iff_rejected, psubmit1_xi_rejected_exit_is_REVERT and psubmit1_exitAgrees_of_zero_length_rejected treat the admissible-false path exactly as the inhibited path was treated, so XiTransport.psubmit1_xi_rejected_reverts_of_zero_length observes it at complete Xi with no ExitAgrees premise. XiTransport.userCall_returnData_ne_nil_iff proves that the only Model.userCall branch whose answer carries return data is the uninhibited empty-calldata zero-value fee quote, which makes the list of remaining branches exhaustive rather than a survey. Consequently A-ABSTRACT-TX is no longer load-bearing for any branch that publishes nothing: what it still buys is exactly two byte-level facts about memory at the exit instruction - the 32 bytes P-CONTROL-1's RETURN publishes and the encoded FIFO window P-DRAIN-1's RETURN publishes on a non-empty queue - plus the fact that the pinned runtimes reach an exit instruction at all. Those two are narrowed but not closed: XiTransport.pcontrol1_exitAgrees_iff_digits turns the fee quote's residual into 32 independent digit equations at the pinned width, and XiTransport.pdrain1_exitAgrees_head_record turns the drain's into a per-Record obligation on the head and tail of the capped window. Both are iffs or projections and change nothing about what is assumed. Closing the assumption still requires a universal opcode-level proof over the pinned runtimes establishing what memory holds at the exit, and it must also show Xi realises applyUser and applySystem on WellFormed images. EndpointAgrees is NOT discharged by this revision. R4 finally makes the residual's remaining surface a proved complement rather than a list. XiTransport.systemCall_returnData_ne_nil_iff and XiTransport.step_returnData_ne_nil_iff together establish that the only steps of the abstract API whose answer carries any bytes are the two XiTransport.DataBranch cases, so XiTransport.xi_observes_model_of_not_dataBranch discharges the residual at complete Xi uniformly over every kind and every Model.Step outside them, with no ExitAgrees premise. What A-ABSTRACT-TX still buys is therefore exactly the two DataBranch obligations already named - the 32 bytes P-CONTROL-1's RETURN publishes and the encoded capped FIFO window P-DRAIN-1's RETURN publishes on a non-empty queue - together with the fact that