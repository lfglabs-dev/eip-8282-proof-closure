      "risk": "Success/revert semantics of Model.userCall/systemCall are abstract and are not executable EVM trace semantics. F4 closed CFG dispatch; R4 closes the X to Xi observation layer and the exit-instruction layer unconditionally, and R4 additionally discharges the residual outright on P-SUBMIT-1's inhibited and accepting paths, on P-DRAIN-1's empty-window branch and on P-CONTROL-1's paid fee-getter branch, but the universal endpoint observation proof for every user/system path remains an explicit premise (ExitAgrees, equivalent to the former EndpointAgrees) rather than a proved forall. R5 sharpens the storage part rather than closing it: for every ReachableStorage image, Xi on the pinned runtime must realise applyUser/applySystem. Neither ExitAgrees nor that realisation is proved.",
      "justification": "Isolates the unproved correspondence between Model.userCall/systemCall and EvmYul.EVM.Xi. The three registered parents remain CFG-direct foralls plus kill-line traces and must not be read as Xi computing those functions. R4 transports those same IDs to complete-Xi observations only under ExitAgrees. R5 proves constructor/call preservation and Model.Reachable entirely on the packed-storage/model side; it never runs Xi and therefore does not discharge ExitAgrees.",
      "severity": "HIGH",
      "violation_impact": "Any guarantee linked to this premise must be re-evaluated against assembly/bytecode. Because A-REACHABLE's residual now folds into this entry, a violation here also invalidates the claim that ReachableStorage describes the images the predeploys can actually reach - the containment proofs would remain true but would be about the wrong closure.",
      "validation": "Named in every consuming theorem's metadata. Eip8282.Audit.Correspondence states Corresponds is not Ξ agreement. Eip8282.Audit.XiTransport carries the assumption explicitly as the premise XiTransport.ExitAgrees: with four exceptions every transported statement in that module takes it as a hypothesis, so a green build there is not evidence that it holds. The first exception is P-SUBMIT-1's inhibited path: XiTransport.psubmit1_exitAgrees_of_zero_length proves ExitAgrees from the exit's own stack operands, so XiTransport.psubmit1_xi_inhibited_reverts_of_zero_length carries no ExitAgrees hypothesis and that branch no longer rests on this assumption. The second is P-DRAIN-1's empty-window branch, new in this revision: Model.systemCall has no revert constructor, so XiTransport.pdrain1_exitAgrees_iff states the drain residual in closed form as op != REVERT together with a byte equation against concatReturned of the capped FIFO window, with no Outcome left in it; XiTransport.pdrain1_xi_exit_not_REVERT reads the REVERT refutation off that iff with no hypothesis at all about the window, the represented kind or the run, and XiTransport.pdrain1_xi_exit_is_RETURN combines it with pdrain1_xi_exit_publishes to pin the drain's exit opcode to exactly one of H's four branches. When the window encodes to nothing, XiTransport.pdrain1_exitAgrees_of_silent and XiTransport.pdrain1_exitAgrees_of_zero_length produce ExitAgrees rather than consume it, so XiTransport.pdrain1_xi_empty_window_returns_nothing is a complete-Xi observation with no ExitAgrees premise. Every other consuming statement still does. XiTransport.endpointAgrees_iff_exitAgrees proves the restated premise is equivalent to the former EndpointAgrees, so that restatement neither strengthens nor weakens what is being assumed. R4 additionally removes the H post.toMachineState op = some out side condition and the universally quantified output ByteArray from every transported statement: XiTransport.exit_halting derives from EvmYul.EVM.Proof.RunUntil.stop_of_rem_pos that a block which stopped with fuel remaining stopped at a halting opcode, and XiTransport.exit_H composes that with H_eq_none_iff to prove H is some at the exit. That is a strict reduction in what a caller must supply - one premise instead of two - but it is not a weakening of the semantic content still assumed, which remains ExitAgrees alone. R4 further proves the width of the published slice rather than leaving it inside the residual: XiTransport.size_readWithPadding shows ByteArray.readWithPadding zero-pads up to the requested length, so XiTransport.length_bytes_haltData pins the number of bytes a RETURN or REVERT publishes to that instruction's own length operand, and XiTransport.xiWidthTransport carries this at complete Xi with no hypothesis beyond the run and the shape of the operand stack. The exact-width equalities carry an explicit machine-word side condition mu1.toNat < USize.size, which is not cosmetic because USize.size is 2 ^ System.Platform.numBits and may be 2 ^ 32; the inequality directions are unconditional. Consequently XiTransport.psubmit1_exitAgrees_iff_operand restates P-SUBMIT-1's residual with no ByteArray left in it, XiTransport.pdrain1_xi_exit_length_ge and pdrain1_xi_exit_length_eq pin P-DRAIN-1's length operand to the width of the FIFO window, and XiTransport.pcontrol1_xi_exit_length_ge_32 and pcontrol1_xi_exit_length_eq_32 sharpen P-CONTROL-1's operand from non-zero to exactly 32. These are carried as new named conjuncts on the unchanged registered parents psubmit1_xi_forall_parent, pdrain1_xi_forall_parent and pcontrol1_xi_forall_parent, whose final type_of% conjunct is untouched so the existing one-byte kill-lines still refute them. None of this discharges the assumption; it removes how much is published from the residual and leaves which bytes. Eip8282.Audit.Reachable states that it never runs Xi; Eip8282.Audit.Trust prints axioms for its closure theorems, and none of those lines may carry a native_decide receipt. This revision also strengthens the registered parent pdrain1_xi_forall_parent in place: the conjunct that previously concluded op = RETURN or op = REVERT on a non-empty window now concludes op = RETURN, and three conjuncts are added carrying the closed-form residual, the unconditional REVERT refutation, and the empty-window complete-Xi observation. The final type_of% conjunct is untouched, so the existing one-byte kill-line Eip8282.Tests.PDrain1Mutant still refutes the mutated bytecode exactly as before. None of the new theorems carries native_decide or a project axiom, and none of them discharges the assumption: what P-DRAIN-1 still owes is which bytes the pinned runtime's RETURN publishes on a non-empty window, and that it reaches that RETURN at all. The third and fourth exceptions are new in this revision, and they belong to the other two parents. For P-SUBMIT-1, the inhibited path was only half the user call: XiTransport.psubmit1_exitAgrees_iff_accepted states the residual on the accepting path - uninhibited, non-empty calldata, admissible - in closed form as op != REVERT together with bytes out = nil, because Model.userCall answers an accepted submission with .success _ nil; XiTransport.psubmit1_xi_accepted_exit_not_REVERT reads the REVERT refutation off that iff with no hypothesis about the run at all, and XiTransport.psubmit1_exitAgrees_of_silent_accepted and psubmit1_exitAgrees_of_zero_length_accepted produce ExitAgrees rather than consume it, so XiTransport.psubmit1_xi_accepted_returns_nothing observes the complete Xi call succeeding with no data under no ExitAgrees premise. For P-CONTROL-1, XiTransport.pcontrol1_exitAgrees_iff states the fee getter's residual in closed form as op != REVERT together with bytes out = toBeBytes (currentFee model) 32, with no Outcome left in it, so XiTransport.pcontrol1_xi_exit_not_REVERT drops the H post.toMachineState op = some out side condition that pcontrol1_xi_exit_is_RETURN needed; and the fee getter is proved non-payable: an empty-calldata call carrying value is refused by Model.userCall before the quote is computed, so XiTransport.pcontrol1_exitAgrees_iff_paid gives that branch the same pure EVM-side residual as P-SUBMIT-1's inhibited path, XiTransport.pcontrol1_xi_paid_exit_is_REVERT pins its exit opcode with no hypothesis about H or memory, and XiTransport.pcontrol1_xi_paid_fee_getter_reverts_of_zero_length observes the complete Xi call reverting with no data under no ExitAgrees premise. This revision also strengthens psubmit1_xi_forall_parent and pcontrol1_xi_forall_parent in place, by adding conjuncts carrying those closed forms and complete-Xi observations; in both the final type_of% conjunct is untouched, so the existing one-byte kill-lines Eip8282.Tests.PSubmit1Mutant and Eip8282.Tests.PControl1Mutant still refute the mutated bytecode exactly as before. None of the new theorems carries native_decide or a project axiom, and none of them discharges the assumption: what P-SUBMIT-1 still owes is that the pinned runtime reaches the exit its abstract counterpart predicts on each branch, what P-CONTROL-1 still owes is which 32 bytes of memory the fee getter's RETURN publishes, and A-ABSTRACT-TX stays OPEN at HIGH. This revision closes the last Model.userCall branch that had never been touched and makes the branch count exact. XiTransport.psubmit1_exitAgrees_iff_rejected states the rejected-submission residual - uninhibited, non-empty calldata, admissible false - in closed form as op = REVERT together with bytes out = nil, with no Outcome left in it; XiTransport.psubmit1_xi_rejected_exit_is_REVERT reads the opcode off that iff with no hypothesis about H or memory; and XiTransport.psubmit1_exitAgrees_of_zero_length_rejected produces ExitAgrees rather than consuming it, so XiTransport.psubmit1_xi_rejected_reverts_of_zero_length observes the complete Xi call reverting with no data under no ExitAgrees premise. That is the fifth and last exception on the user side. XiTransport.userCall_returnData_ne_nil_iff then proves the enumeration is exhaustive rather than anecdotal: a Model.userCall answer carries non-empty return data if and only if the call is uninhibited with empty calldata and zero value, which is exactly P-CONTROL-1's fee quote. Every other user-side branch answers with no data, and every one of those is now discharged, so on the Model.userCall side exactly one branch still rests on this assumption and it is named. The two branches that do carry bytes are narrowed rather than closed. XiTransport.pcontrol1_exitAgrees_iff_digits replaces P-CONTROL-1's list equation, at the already-pinned width of 32, with 32 independent digit equations stating that byte i of the published slice is (currentFee model / 256 ^ (31 - i)) % 256. XiTransport.pdrain1_exitAgrees_head_record splits P-DRAIN-1's byte equation on a non-empty capped FIFO window into the head record's own encoding and the tail's, so the remaining obligation is about one Record at a time rather than about a concatenation. Both are iff-shaped or projections of the residual and therefore neither strengthen nor weaken what is assumed. These are carried as five new named conjuncts on the unchanged registered parents psubmit1_xi_forall_parent (three), pdrain1_xi_forall_parent (one) and pcontrol1_xi_forall_parent (one); in all three the final type_of% conjunct is untouched, so the existing one-byte kill-lines Eip8282.Tests.PSubmit1Mutant, PDrain1Mutant and PControl1Mutant still refute the mutated bytecode exactly as before. None of the new theorems carries native_decide or a project axiom, and none of them discharges the assumption. EndpointAgrees is NOT discharged. A-ABSTRACT-TX stays OPEN at HIGH. This revision makes the branch enumeration exhaustive over the whole abstract API rather than over Model.userCall alone. XiTransport.systemCall_returnData_ne_nil_iff is the system-side counterpart of userCall_returnData_ne_nil_iff: Model.systemCall is total and answers with the encoded capped FIFO prefix, so its answer carries return data if and only if concatReturned of that prefix is non-empty. XiTransport.DataBranch names the two resulting cases - P-CONTROL-1's uninhibited empty-calldata zero-value fee quote on the user side, and a non-empty capped FIFO window on the system side - and XiTransport.step_returnData_ne_nil_iff proves, by cases on the two constructors of Model.Step with an iff on each, that a Model.step answer carries bytes if and only if the step is one of those two. That is a classification of the entire abstract API the three registered parents are stated against, not a survey of the cases that happened to be treated. XiTransport.observeModel_eq_of_returnData_nil and XiTransport.returnData_eq_nil_of_not_dataBranch read the complement off it, XiTransport.exitAgrees_of_zero_length_of_not_dataBranch produces ExitAgrees rather than consuming it on every non-DataBranch step at once, and XiTransport.xi_observes_model_of_not_dataBranch is a single complete-Xi observation quantified over every kind and every Model.Step, carrying no ExitAgrees premise, which subsumes the five branch-specific discharges recorded above. These are carried as new named conjuncts on the unchanged registered parents psubmit1_xi_forall_parent (two), pdrain1_xi_forall_parent (three) and pcontrol1_xi_forall_parent (two); in all three the final type_of% conjunct is untouched, so the existing one-byte kill-lines Eip8282.Tests.PSubmit1Mutant, PDrain1Mutant and PControl1Mutant still refute the mutated bytecode exactly as before. None of the new theorems carries native_decide, a project axiom or a sorry, and none of them discharges the assumption. EndpointAgrees is NOT discharged. A-ABSTRACT-TX stays OPEN at HIGH. This revision states the residual as the memory equation it actually is, so that a complete-Xi observation can be reached without naming it. XiTransport.exitAgrees_iff_memory_bytes proves, in both directions, that on a RETURN or REVERT exit whose stack operands are read off the machine, ExitAgrees holds if and only if two independent facts hold: the exit is a REVERT if and only if the abstract step reverts, and the slice of pre-step memory the exit's own offset and length operands select carries exactly the abstract step's bytes. Because both directions are proved this is a restatement at equal strength, in the same sense endpointAgrees_iff_exitAgrees was, and it neither strengthens nor weakens what is assumed. XiTransport.XiMemoryTransport is then the transport asking for those two facts instead, quantified over every kind and every Model.Step, with no ExitAgrees and no EndpointAgrees hypothesis anywhere in its statement; XiTransport.xiMemoryTransport proves it from xiTransport through that equivalence. XiTransport.memory_bytes_of_zero_length_of_not_dataBranch derives the byte equation outright on every non-DataBranch step whose length operand is zero, so on the data-free surface the equation is proved rather than assumed; that is what makes the residual being two byte equations a claim about the whole abstract API rather than a summary of the branches that happened to be treated. What remains assumed is exactly two byte equations, on exactly the two DataBranch steps, and each is now written out verbatim as a claim about which bytes of a pinned runtime's memory sit at the slice its own RETURN selects: XiTransport.pdrain1_xi_returns_fifo_prefix_of_memory for P-DRAIN-1's capped FIFO window and XiTransport.pcontrol1_xi_fee_getter_of_memory for P-CONTROL-1's 32-byte fee quote. These are carried as new named conjuncts on the unchanged registered parents psubmit1_xi_forall_parent (two), pdrain1_xi_forall_parent (three) and pcontrol1_xi_forall_parent (three); in all three the final type_of% conjunct is untouched, so the existing one-byte kill-lines Eip8282.Tests.PSubmit1Mutant, PDrain1Mutant and PControl1Mutant still refute the mutated bytecode exactly as before. Removing the named predicate from a transport's hypotheses is not the same as proving it: the two byte equations above are still open, no opcode-level proof that the pinned runtimes write those bytes is claimed here, XiTransport itself still consumes ExitAgrees and is unchanged, and none of the new theorems carries native_decide, a project axiom or a sorry. EndpointAgrees is NOT discharged. A-ABSTRACT-TX stays OPEN at HIGH. This revision discharges the residual at concrete storage images for the first time, and the statements recorded above that no run of the pinned bytecode is proved to reach any particular opcode no longer hold without qualification. XiTransport.pinnedCall builds an XiCall whose result is definitionally the Eip8282.Audit.EvmRunner.run that the registered main theorems already evaluate - both unfold to the same EvmYul.EVM.Xi application - and the bridge lemmas XiTransport.pinnedCall_result_exitSystem, pinnedCall_result_depositSystem and pinnedCall_result_exitUser are rfl. On that bridge XiTransport.pdrain1_xi_drains_pinned_exit_under_cap, pdrain1_xi_drains_pinned_exit_over_cap, pdrain1_xi_drains_pinned_deposit and pcontrol1_xi_quotes_pinned_fee each state the conclusion of the transport - observe c.result = some (observeModel of the abstract step) - with no ExitAgrees hypothesis, no memory hypothesis and no byte equation assumed, and prove it by evaluating the pinned bytecode. XiTransport.represents_pinnedExitSystem, represents_pinnedDepositSystem and represents_pinnedExitFeeGetter certify that those runs are genuine Represents instances of the model states they are compared against rather than unrelated executions, and XiTransport.pdrain1_xi_pinned_exit_discriminates is the negative control: the same run is proved not to equal the observation of a neighbouring model state, so the positive results are not vacuous. These are carried as new named conjuncts on the unchanged registered parents pdrain1_xi_forall_parent (six) and pcontrol1_xi_forall_parent (two); psubmit1_xi_forall_parent is unchanged, and in all three the final type_of% conjunct is untouched, so the existing one-byte kill-lines Eip8282.Tests.PSubmit1Mutant, PDrain1Mutant and PControl1Mutant still refute the mutated bytecode exactly as before. This does NOT close the assumption. Four storage images are not all storage images, the discharge is by native_decide and therefore rests on A-NATIVE-DECIDE, XiTransport itself still consumes ExitAgrees and is unchanged, and the two universally quantified byte equations XiTransport.pdrain1_xi_returns_fifo_prefix_of_memory and pcontrol1_xi_fee_getter_of_memory still take the byte equation as an open hypothesis at arbitrary storage. What changes is that the residual is no longer untested at every argument: before this revision no run of the pinned bytecode was proved to agree with Model.step anywhere. None of the new theorems carries a project axiom or a sorry. EndpointAgrees is NOT discharged. A-ABSTRACT-TX stays OPEN at HIGH.",
      "removal_path": "Replace with a machine-checked correspondence from Model.userCall/systemCall to EvmYul.EVM.Xi on the pinned runtimes. Scope note (R4): the X to Xi layer is closed unconditionally by Eip8282.Audit.XiTransport.observe_Xi_eq_observe_X - a complete Xi message call and the X run it delegates to have the same observation (revert flag and return bytes), because Xi only re-wraps X's success payload and passes revert through; and by XiTransport.Xi_validJumps_eq the jumpdest table Xi derives for itself from the pinned code is the kernel-checked depositJumpdests / exitJumpdests. R4 additionally closes the exit-instruction layer unconditionally: XiTransport.observe_result_exit proves the complete Xi call observes exactly the halting instruction the code run exits on, and XiTransport.exit_op_cases / out_eq_H_return / bytes_eq_nil_of_silent read off EVMYulLean's H that the exit opcode is one of RETURN / REVERT / STOP / SELFDESTRUCT, that RETURN and REVERT publish exactly the requested memory slice (so the output ByteArray is determined rather than universally quantified), and that STOP and SELFDESTRUCT publish nothing. None of these carries native_decide. These reduce the surface the premise must cover but do NOT discharge it: XiTransport.exitAgrees_of_silent closes the two silent-halt branches, XiTransport.pcontrol1_xi_exit_is_RETURN pins P-CONTROL-1's exit opcode to RETURN because a 32-byte fee quote cannot come from a silent halt or a revert, XiTransport.pdrain1_xi_exit_publishes refutes the silent halts for P-DRAIN-1 on a non-empty FIFO window, and XiTransport.psubmit1_exitAgrees_iff shows P-SUBMIT-1's residual is exactly the two EVM-side facts op = REVERT and bytes out = nil with no Model reference. R4 also proves the H side condition rather than assuming it: XiTransport.exit_halting (from EvmYul.EVM.Proof.RunUntil.stop_of_rem_pos) and XiTransport.exit_H (composing it with H_eq_none_iff) show H is some at the exit, so the published bytes are the function XiTransport.haltData post.toMachineState op rather than a quantified ByteArray carried with a side condition, and XiTransport.xiExitTransport now has no hypothesis at all beyond the run. What remains open is strictly the endpoint obligation on the RETURN / REVERT branches: that the memory slice the pinned predeploy publishes there agrees with Model.step on every calldata / value / storage branch, and that it exits by REVERT exactly when the model reverts. No run of the pinned bytecode is proved to reach any particular opcode. The inversion previously recorded here as the next lemma owed is now proved: EvmYul.EVM.Proof contains none at the pinned revision d164b61b995f4f553e975db9cfe3640d0aeefafa, so R4 supplies it. XiTransport.step_REVERT_H_return and XiTransport.step_RETURN_H_return invert EVMYulLean's step at the publishing halts into post.toMachineState.H_return = mid.memory.readWithPadding of the exit's own two stack operands, via a chain of definitional steps through EVM.step, EvmYul.step and EVM.binaryMachineStateOp. XiTransport.haltData_eq_memory_slice lifts that to haltData and XiTransport.bytes_haltData_eq_nil_of_zero_length concludes that a RETURN or REVERT whose length operand is zero publishes no bytes, whatever the offset and whatever memory holds. The byte half of P-SUBMIT-1's residual is therefore proved rather than assumed, and XiTransport.psubmit1_xi_inhibited_reverts_of_zero_length concludes that an inhibited predeploy is observed to revert with no data under no ExitAgrees premise at all - only the EVM-side facts that the run exits on REVERT with a zero length operand. XiTransport.xiSliceTransport bundles the same content with no hypothesis beyond the run and the shape of the operand stack. None of these carries native_decide or a project axiom. This does NOT close the assumption. For P-DRAIN-1 and P-CONTROL-1 the residual is only restated over memory by XiTransport.exitAgrees_iff_memory_slice, which is an iff and so neither strengthens nor weakens it, and XiTransport.pcontrol1_xi_exit_length_ne_zero adds only that a 32-byte fee quote cannot be published by a zero-width slice. What still has no proof is that the pinned runtimes reach any particular exit opcode, what their memory and stack hold when they do, and that the published slice agrees with Model.step on every calldata / value / storage branch. Closing the assumption requires a universal opcode-level proof over the pinned runtimes, not another finite trace. Closing it must also show Xi realises applyUser and applySystem on WellFormed images, which is the R5 residual folded into this entry. R4 additionally settles the width question outright. XiTransport.size_readWithPadding_le and XiTransport.size_readWithPadding invert EvmYul's ByteArray.readWithPadding - which appends ffi.ByteArray.zeroes of the shortfall, computed as a BitVec subtraction through a machine word - to show the published slice has at most, and under mu1.toNat < USize.size exactly, the size its own length operand names, whatever the offset and whatever memory holds; XiTransport.size_readWithPadding_of_lt_two_pow_32 is the platform-independent corollary and XiTransport.natCast_sub_bitvec / toNat_natCast_sub are the machine-word lemmas it needs. XiTransport.length_bytes_haltData_le and XiTransport.length_bytes_haltData lift this to the exit instruction, XiTransport.exitAgrees_length_operand_le and exitAgrees_length_operand transfer it across the residual premise, and XiTransport.xiWidthTransport bundles all four at complete Xi for every kind. The per-parent consequences are XiTransport.psubmit1_exitAgrees_iff_operand, which makes P-SUBMIT-1's residual the pure instruction-level statement op = REVERT and mu1.toNat = 0; XiTransport.pdrain1_returnData with pdrain1_xi_exit_length_ge and pdrain1_xi_exit_length_eq, which pin P-DRAIN-1's length operand to the width of concatReturned of the FIFO window; and XiTransport.pcontrol1_returnData_length with pcontrol1_xi_exit_length_ge_32 and pcontrol1_xi_exit_length_eq_32, which pin P-CONTROL-1's to exactly 32. None carries native_decide or a project axiom. This still does NOT close the assumption. What remains open is, verbatim, the premise ExitAgrees op (haltData post.toMachineState op) (Model.step model mstep), equivalently EndpointAgrees via endpointAgrees_iff_exitAgrees: nothing proves the pinned runtimes reach any particular exit instruction, nor which bytes their memory holds when they do. After R4 the residual is about which bytes are published, not how many. R4 additionally refutes one more exit branch outright. Because Model.systemCall is total - it has no revert constructor - the drain residual cannot be satisfied by a REVERT, which XiTransport.pdrain1_xi_exit_not_REVERT proves with no hypothesis beyond the residual itself. With XiTransport.pdrain1_xi_exit_publishes already refuting the silent halts on a non-empty FIFO window, XiTransport.pdrain1_xi_exit_is_RETURN leaves P-DRAIN-1 with a single surviving exit opcode. On an empty window the residual is not merely narrowed but proved: XiTransport.pdrain1_exitAgrees_of_silent covers the STOP and SELFDESTRUCT branches and XiTransport.pdrain1_exitAgrees_of_zero_length the zero-width RETURN, so XiTransport.pdrain1_xi_empty_window_returns_nothing observes the complete Xi call succeeding with no data under no ExitAgrees premise. This does NOT close the assumption. It removes the revert branch and the empty window from what A-ABSTRACT-TX must cover for P-DRAIN-1; what remains is the non-empty window, where nothing proves the pinned runtime reaches its RETURN nor that the memory slice it publishes there is concatReturned of the capped queue prefix. R4 finally carries the same treatment to the other two parents, on the branches where the abstract side decides the answer without reference to memory. Model.userCall returns .success _ nil for an accepted submission, so XiTransport.psubmit1_exitAgrees_iff_accepted, psubmit1_exitAgrees_of_silent_accepted and psubmit1_exitAgrees_of_zero_length_accepted discharge P-SUBMIT-1's accepting path the same way the inhibited path was discharged, and XiTransport.psubmit1_xi_accepted_returns_nothing observes it at complete Xi with no ExitAgrees premise. Model.userCall reverts an empty-calldata call carrying value before computing the quote, so XiTransport.pcontrol1_exitAgrees_iff_paid, pcontrol1_xi_paid_exit_is_REVERT and pcontrol1_exitAgrees_of_zero_length_paid discharge P-CONTROL-1's paid branch, and XiTransport.pcontrol1_xi_paid_fee_getter_reverts_of_zero_length observes it at complete Xi with no ExitAgrees premise. XiTransport.pcontrol1_exitAgrees_iff additionally states the quoting branch's residual in closed form, which removes the H side condition from the REVERT refutation but is an iff and therefore neither strengthens nor weakens the assumption there. None of these carries native_decide or a project axiom. This does NOT close the assumption. After R4 the branches A-ABSTRACT-TX must still cover are exactly the ones whose abstract answer carries bytes read out of memory: P-DRAIN-1 on a non-empty FIFO window, P-CONTROL-1's 32-byte fee quote, and in every case the fact that the pinned runtime reaches the exit instruction at all. Nothing here proves any run of the pinned bytecode reaches any particular opcode. R4 finally closes the rejected-submission branch and bounds the enumeration. XiTransport.psubmit1_exitAgrees_iff_rejected, psubmit1_xi_rejected_exit_is_REVERT and psubmit1_exitAgrees_of_zero_length_rejected treat the admissible-false path exactly as the inhibited path was treated, so XiTransport.psubmit1_xi_rejected_reverts_of_zero_length observes it at complete Xi with no ExitAgrees premise. XiTransport.userCall_returnData_ne_nil_iff proves that the only Model.userCall branch whose answer carries return data is the uninhibited empty-calldata zero-value fee quote, which makes the list of remaining branches exhaustive rather than a survey. Consequently A-ABSTRACT-TX is no longer load-bearing for any branch that publishes nothing: what it still buys is exactly two byte-level facts about memory at the exit instruction - the 32 bytes P-CONTROL-1's RETURN publishes and the encoded FIFO window P-DRAIN-1's RETURN publishes on a non-empty queue - plus the fact that the pinned runtimes reach an exit instruction at all. Those two are narrowed but not closed: XiTransport.pcontrol1_exitAgrees_iff_digits turns the fee quote's residual into 32 independent digit equations at the pinned width, and XiTransport.pdrain1_exitAgrees_head_record turns the drain's into a per-Record obligation on the head and tail of the capped window. Both are iffs or projections and change nothing about what is assumed. Closing the assumption still requires a universal opcode-level proof over the pinned runtimes establishing what memory holds at the exit, and it must also show Xi realises applyUser and applySystem on WellFormed images. EndpointAgrees is NOT discharged by this revision. R4 finally makes the residual's remaining surface a proved complement rather than a list. XiTransport.systemCall_returnData_ne_nil_iff and XiTransport.step_returnData_ne_nil_iff together establish that the only steps of the abstract API whose answer carries any bytes are the two XiTransport.DataBranch cases, so XiTransport.xi_observes_model_of_not_dataBranch discharges the residual at complete Xi uniformly over every kind and every Model.Step outside them, with no ExitAgrees premise. What A-ABSTRACT-TX still buys is therefore exactly the two DataBranch obligations already named - the 32 bytes P-CONTROL-1's RETURN publishes and the encoded capped FIFO window P-DRAIN-1's RETURN publishes on a non-empty queue - together with the fact that the pinned runtimes reach an exit instruction at all. No run of the pinned bytecode is proved to reach any particular opcode by this revision. Closing the assumption still requires a universal opcode-level proof over the pinned runtimes establishing what memory holds at the exit, and it must also show Xi realises applyUser and applySystem on WellFormed images. EndpointAgrees is NOT discharged by this revision. Correction to the sentences above, which were written before this revision and are no longer accurate as stated: it is no longer true that no run of the pinned bytecode is proved to reach any particular opcode. XiTransport.pinnedCall exhibits an XiCall whose result is definitionally the EvmRunner.run the registered main theorems evaluate, and at four concrete storage images - the exit queue below the cap, the exit queue above the cap so that the cap is exercised, the deposit queue, and the fee getter - XiTransport.pdrain1_xi_drains_pinned_exit_under_cap, pdrain1_xi_drains_pinned_exit_over_cap, pdrain1_xi_drains_pinned_deposit and pcontrol1_xi_quotes_pinned_fee prove the transport's conclusion outright, with the residual computed rather than assumed. The remaining obligation is therefore universality and not existence: what is still owed is that the same agreement holds at every WellFormed storage image, on every calldata and value branch, and that is what a universal opcode-level proof over the pinned runtimes would supply. The instance-level discharge is by native_decide and so is subject to A-NATIVE-DECIDE; it does not remove the requirement that Xi realises applyUser and applySystem on WellFormed images. EndpointAgrees is NOT discharged by this revision."
