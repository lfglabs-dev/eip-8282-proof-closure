{
  "schema": "eip-8282-assumptions-v1",
  "certification": {
    "status": "DEV-READY",
    "audit_cert": false,
    "statement": "DEV-READY is development readiness, not AUDIT-CERT. Abstract-model CHECKED does not close the pinned-bytecode layer."
  },
  "assumptions": [
    {
      "id": "A-ABSTRACT-TX",
      "accepted": true,
      "risk": "Success/revert semantics of Model.userCall/systemCall are abstract and are not executable EVM trace semantics. F4 closed CFG dispatch and Corresponds observations, not Ξ ↔ Model.",
      "justification": "Isolates the unproved correspondence between Model.userCall and EvmYul.EVM.Xi. P-SUBMIT-1's ∀ parent is CFG-direct (revert/append/getter/fakeExponential) and must not be read as Ξ computing those functions.",
      "severity": "HIGH",
      "violation_impact": "Any guarantee linked to this premise must be re-evaluated against assembly/bytecode.",
      "validation": "Named in every consuming theorem's metadata. Eip8282.Audit.Correspondence states Corresponds is not Ξ agreement.",
      "removal_path": "Replace with a machine-checked correspondence from Model.userCall/systemCall to EvmYul.EVM.Xi on the pinned runtimes."
    },
    {
      "id": "A-REACHABLE",
      "accepted": true,
      "risk": "Theorems are stated for the abstract State type; Reachable is defined but not yet an explicit hypothesis on every parent.",
      "justification": "The specified deployments are initialDeposit and initialExit; Reachable closes under step.",
      "severity": "MEDIUM",
      "violation_impact": "A theorem about an arbitrary corrupted storage image is not a theorem about the predeploys.",
      "validation": "Reachable inductive in Eip8282.Audit.Model.",
      "removal_path": "Put Reachable s in every parent hypothesis."
    },
    {
      "id": "A-CLASSICAL-CHOICE",
      "accepted": true,
      "risk": "Classical Lean rather than constructive.",
      "justification": "Standard Lean 4 kernel axiom; no project-specific claim rests on computational content of choice.",
      "severity": "LOW",
      "violation_impact": "None for the invariance theorems.",
      "validation": "#print axioms in Eip8282.Audit.Trust.",
      "removal_path": "Not required."
    },
    {
      "id": "A-NATIVE-DECIDE",
      "accepted": true,
      "risk": "The pinned-bytecode parent is discharged by native_decide, adding one compiler-generated axiom per theorem (<theorem>._native.native_decide.ax_1_1 under Lean 4.31) and with it the Lean compiler and the EVMYulLean interpreter to the trusted base.",
      "justification": "Forced, not chosen: EvmYul.EVM.Xi reaches D_J, whose worker D_J_aux is a partial def (EvmYul/EVM/Semantics.lean:99) and is kernel-opaque, so decide and rfl cannot reduce any concrete Xi trace. The alternative is no bytecode layer at all.",
      "severity": "MEDIUM",
      "violation_impact": "A Lean compiler or EVMYulLean interpreter bug could make the bytecode-layer facts false while the build stays green. The abstract-model theorems are unaffected.",
      "validation": "#print axioms in Eip8282.Audit.Trust names exactly which theorems carry it; the P-SUBMIT-1 / P-DRAIN-1 / P-CONTROL-1 bytecode kill-lines show the evaluation is discriminating rather than constant-true.",
      "removal_path": "Land a structurally recursive jumpdest scanner in EVMYulLean, then replace native_decide with decide."
    },
    {
      "id": "A-EVM-WORLD",
      "accepted": true,
      "risk": "The bytecode layer executes on a synthetic two-account world (predeploy plus caller) with a default block header, not on mainnet state. P-SUBMIT-1's ∀ parent is under WellFormed / CallHyp (gas ≥ 30M, fuel ≥ 80000, user caller); P-DRAIN-1 and P-CONTROL-1 remain finite traces at chosen storage images.",
      "justification": "Xi is the real EVM message-call semantics; only the surrounding world is synthetic. The ∀ parent does not quantify over arbitrary raw storage: WellFormed packs slots 0–3 and requires head ≤ tail.",
      "severity": "HIGH",
      "violation_impact": "A theorem about an ill-formed storage image, a system caller, or a starved-gas call is not a theorem about the predeploy user path. Kill-line traces still refute mutants of the pinned bytes.",
      "validation": "Eip8282.Audit.Correspondence.CallHyp and Eip8282.Audit.EvmRunner.worldWith / callEnv are the world construction.",
      "removal_path": "Close A-ABSTRACT-TX so the WellFormed ∀ transports to Ξ, or execute against observed mainnet predeploy state."
    },
    {
      "id": "A-PINNED-SOURCE",
      "accepted": true,
      "risk": "Assembly and EIP text are pinned snapshots, not live-deployed bytecode.",
      "justification": "sys-asm@83f9801 and EIPs PR #12120 head b759aae8 are the working references.",
      "severity": "HIGH",
      "violation_impact": "A later sys-asm or EIP revision can invalidate the model.",
      "validation": "audit/artifacts.lock.json sha256 of pinned files.",
      "removal_path": "Add deployed-bytecode observation and keccak identity."
    }
  ]
}
