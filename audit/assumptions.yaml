      "id": "A-NATIVE-DECIDE",
      "accepted": true,
      "risk": "The kept Xi trace theorems and the mutant kill-lines are discharged by native_decide, adding one compiler-generated axiom per theorem (<theorem>._native.native_decide.ax_1_1 under Lean 4.31) and with it the Lean compiler and the EVMYulLean interpreter to the trusted base. Scope note: as of EVMYulLean 0ff72b2 this no longer covers the jumpdest tables. D_J_aux is now structurally recursive (fuel = c.size), so deposit_D_J, exit_D_J, depositInit_D_J and exitInit_D_J are closed by decide +kernel, and the validJumps = D_J _ 0 bridges in Eip8282.Audit.Step that the registered forall parents rewrite with are kernel-checked.",
      "justification": "Forced for Xi traces by cost, not by an irreducible definition. Earlier revisions of this entry blamed the opaque @[extern] FFI constants and the partial RLP decoders; that is wrong for this path. Decoding the four pinned images (depositRuntime 628 bytes, depositInit 638, exitRuntime 458, exitInit 503) finds no SHA3, no BLOCKHASH, no call/create opcode and therefore no precompile dispatch, so the evaluator branches naming EvmYul.FFI.keccak256 / sha256 / BLAKE2Compress are never entered - importing them does not make them part of kernel reduction. Eip8282.Audit.EvmRunner.run builds a world and applies EVM.Xi to it directly, so transaction RLP is never decoded and separateListRLP / deserializeRLP (EvmYul/Wheels.lean) are never called. What is actually infeasible is kernel evaluation of the trace itself: each kept trace is a Xi run of up to FUEL = 80000 interpreter steps (DEPOSIT_CAP_FUEL = 300000 for the deposit-cap traces) over EVMYulLean's monad-transformer stack, AccountMap / Std.TreeSet lookups and UInt256 / ByteArray operations, which decide +kernel cannot whnf in practical time or memory while the compiled evaluator runs it at native speed. The alternative is no Xi-level evidence at all. It is not forced for D_J, which is why the jumpdest scans were moved off it.",
      "severity": "MEDIUM",
      "violation_impact": "A Lean compiler or EVMYulLean interpreter bug could make the kept Xi trace facts false while the build stays green. The abstract-model theorems, the jumpdest tables and the CFG-level forall parents' D_J rewrites are unaffected.",
      "validation": "#print axioms in Eip8282.Audit.Trust names exactly which theorems carry it, and separately shows deposit_D_J / exit_D_J / depositInit_D_J / exitInit_D_J / deposit_validJumps_eq_D_J / exit_validJumps_eq_D_J / depositInit_validJumps_eq_D_J / exitInit_validJumps_eq_D_J and the parent-facing validJumps_are_Xi_tables carrying only the three foundational axioms; the P-SUBMIT-1 / P-DRAIN-1 / P-CONTROL-1 bytecode kill-lines show the evaluation is discriminating rather than constant-true.",
      "removal_path": "Done for the jumpdest scans (EVMYulLean 0ff72b2 + decide +kernel). The remaining Xi traces are already decide-able in principle - nothing on their path is opaque or partial - so removal is a performance problem, not a definitional one: make kernel evaluation of an 80000-step Xi run affordable (cheaper interpreter state representations, whnf-friendly UInt256 / ByteArray / AccountMap operations, or shorter pinned traces), or retire the traces entirely by closing A-ABSTRACT-TX so the CFG forall parents carry the bytecode claims without a finite witness. Note that FFI dynlibs remain a build-time requirement regardless, because native_decide compiles and links the whole interpreter."
    },
    {
      "id": "A-EVM-WORLD",
      "accepted": true,
      "risk": "The bytecode layer executes on a synthetic two-account world (predeploy plus caller) with a default block header, not on mainnet state. All three registered parents are CFG-level ∀ under WellFormed / CallHyp — P-SUBMIT-1 WELL_FORMED_FORALL, P-DRAIN-1 CFG_FORALL, P-CONTROL-1 CFG_FORALL — plus the Wave-1/5/6 Ξ traces the kill-lines still refute. They are not finite-trace-only claims and they do not quantify over arbitrary raw storage or mainnet state.",
      "justification": "Xi is the real EVM message-call semantics; only the surrounding world is synthetic. None of the three ∀ parents quantifies over arbitrary raw storage: WellFormed packs slots 0–3 and requires head ≤ tail. The kept Ξ traces are kill-line witnesses at chosen images, not the scope of the registered parents.",
      "severity": "HIGH",
      "violation_impact": "A theorem about an ill-formed storage image, the wrong caller class, or a starved-gas call is not a theorem about the predeploy path the parent names. Kill-line traces still refute mutants of the pinned bytes.",
      "validation": "Eip8282.Audit.Correspondence.CallHyp and Eip8282.Audit.EvmRunner.worldWith / callEnv are the world construction. audit/guarantees.yaml records evm.scope WELL_FORMED_FORALL (P-SUBMIT-1) and CFG_FORALL (P-DRAIN-1, P-CONTROL-1).",
      "removal_path": "Close A-ABSTRACT-TX so the WellFormed ∀ transports to Ξ, or execute against observed mainnet predeploy state."
    },
