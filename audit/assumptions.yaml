      "justification": "Isolates the unproved correspondence between Model.userCall/systemCall and EvmYul.EVM.Xi. The three registered parents remain CFG-direct foralls plus kill-line traces and must not be read as Xi computing those functions. R4 transports those same IDs to complete-Xi observations only under ExitAgrees. R5 proves constructor/call preservation and Model.Reachable entirely on the packed-storage/model side; it never runs Xi and therefore does not discharge ExitAgrees. R2 adds whole-user-call composition from an R1 Represents world to the complete Xi call, still under an explicit endpoint premise, so it narrows what is assumed without discharging it.",
