  "assumptions": [
    {
      "id": "A-ABSTRACT-TX",
      "status": "OPEN",
      "accepted": true,
      "risk": "Success/revert semantics of Model.userCall/systemCall are abstract and are not executable EVM trace semantics. F4 closed CFG dispatch; R4 closes the X to Xi observation layer and the exit-instruction layer unconditionally, but the universal endpoint observation proof for every user/system path remains an explicit premise (ExitAgrees, equivalent to the former EndpointAgrees) rather than a proved forall.",
      "justification": "Isolates the unproved correspondence between Model.userCall/systemCall and EvmYul.EVM.Xi. The three registered parents remain CFG-direct foralls plus kill-line traces and must not be read as Xi computing those functions. R4 transports those same IDs to complete-Xi observations only under ExitAgrees.",
      "severity": "HIGH",
      "violation_impact": "Any guarantee linked to this premise must be re-evaluated against assembly/bytecode.",
      "validation": "Named in every consuming theorem's metadata. Eip8282.Audit.Correspondence states Corresponds is not Ξ agreement. Eip8282.Audit.XiTransport carries the assumption explicitly as the premise XiTransport.ExitAgrees: every transported statement in that module takes it as a hypothesis and none discharges it, so a green build there is not evidence that it holds. XiTransport.endpointAgrees_iff_exitAgrees proves the restated premise is equivalent to the former EndpointAgrees, so that restatement neither strengthens nor weakens what is being assumed. R4 additionally removes the H post.toMachineState op = some out side condition and the universally quantified output ByteArray from every transported statement: XiTransport.exit_halting derives from EvmYul.EVM.Proof.RunUntil.stop_of_rem_pos that a block which stopped with fuel remaining stopped at a halting opcode, and XiTransport.exit_H composes that with H_eq_none_iff to prove H is some at the exit. That is a strict reduction in what a caller must supply - one premise instead of two - but it is not a weakening of the semantic content still assumed, which remains ExitAgrees alone.",
      "removal_path": "Replace with a machine-checked correspondence from Model.userCall/systemCall to EvmYul.EVM.Xi on the pinned runtimes. Scope note (R4): the X to Xi layer is closed unconditionally by Eip8282.Audit.XiTransport.observe_Xi_eq_observe_X - a complete Xi message call and the X run it delegates to have the same observation (revert flag and return bytes), because Xi only re-wraps X's success payload and passes revert through; and by XiTransport.Xi_validJumps_eq the jumpdest table Xi derives for itself from the pinned code is the kernel-checked depositJumpdests / exitJumpdests. R4 additionally closes the exit-instruction layer unconditionally: XiTransport.observe_result_exit proves the complete Xi call observes exactly the halting instruction the code run exits on, and XiTransport.exit_op_cases / out_eq_H_return / bytes_eq_nil_of_silent read off EVMYulLean's H that the exit opcode is one of RETURN / REVERT / STOP / SELFDESTRUCT, that RETURN and REVERT publish exactly the requested memory slice (so the output ByteArray is determined rather than universally quantified), and that STOP and SELFDESTRUCT publish nothing. None of these carries native_decide. These reduce the surface the premise must cover but do NOT discharge it: XiTransport.exitAgrees_of_silent closes the two silent-halt branches, XiTransport.pcontrol1_xi_exit_is_RETURN pins P-CONTROL-1's exit opcode to RETURN because a 32-byte fee quote cannot come from a silent halt or a revert, XiTransport.pdrain1_xi_exit_publishes refutes the silent halts for P-DRAIN-1 on a non-empty FIFO window, and XiTransport.psubmit1_exitAgrees_iff shows P-SUBMIT-1's residual is exactly the two EVM-side facts op = REVERT and bytes out = nil with no Model reference. R4 also proves the H side condition rather than assuming it: XiTransport.exit_halting (from EvmYul.EVM.Proof.RunUntil.stop_of_rem_pos) and XiTransport.exit_H (composing it with H_eq_none_iff) show H is some at the exit, so the published bytes are the function XiTransport.haltData post.toMachineState op rather than a quantified ByteArray carried with a side condition, and XiTransport.xiExitTransport now has no hypothesis at all beyond the run. What remains open is strictly the endpoint obligation on the RETURN / REVERT branches: that the memory slice the pinned predeploy publishes there agrees with Model.step on every calldata / value / storage branch, and that it exits by REVERT exactly when the model reverts. No run of the pinned bytecode is proved to reach any particular opcode. The next concrete lemma owed is an inversion of EVMYulLean's step at .REVERT yielding post.toMachineState.H_return = mid.memory.readWithPadding _ 0, which would discharge the byte half of P-SUBMIT-1's residual; EvmYul.EVM.Proof contains no such inversion at the pinned revision d164b61b995f4f553e975db9cfe3640d0aeefafa. Closing the assumption requires a universal opcode-level proof over the pinned runtimes, not another finite trace."
    },
    {
      "id": "A-REACHABLE",
      "accepted": true,
      "risk": "The three registered parents are CFG-level ∀ under WellFormed/CallHyp, not under Reachable. WellFormed constrains packed storage (slots 0–3, head ≤ tail) and gas/caller, but does not require the storage image to be reachable from initialDeposit or initialExit via step. Reachable is defined in the abstract model and is not claimed by the CFG parents.",
      "justification": "WellFormed is the bytecode-level analogue of Reachable for the CFG layer. Reachable is a model-level concept that cannot be placed on a CFG parent without first closing A-ABSTRACT-TX (proving Ξ agrees with Model). The specified deployments are initialDeposit and initialExit; Reachable closes under step; WellFormed holds on every reachable storage image.",
      "severity": "MEDIUM",
      "violation_impact": "A theorem about an arbitrary WellFormed storage image that is not reachable from the specified deployment is not a theorem about the predeploys. WellFormed admits images where e.g. excess is astronomically large without having been built up by step.",
      "validation": "Reachable inductive in Eip8282.Audit.Model. WellFormed in Eip8282.Audit.WellFormed. All three parents quantify over WellFormed/CallHyp, not Reachable.",
      "removal_path": "Close A-ABSTRACT-TX first (prove Ξ agrees with Model on well-formed calls), then transport Reachable through the correspondence to derive WellFormed-guarded CFG parents from Reachable-guarded model parents."
    },
