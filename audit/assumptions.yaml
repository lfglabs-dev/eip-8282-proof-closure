urn asked hfresh, that is pre.memory.size = 0. XiTransport.gapStores_exitStores_of_stack embeds the flat pre-staged run with every gap empty at every record count, so nothing proved from the flat statements is lost. All six report only propext, Classical.choice and Quot.sound, carry no native_decide and no project axiom, and are carried as conjuncts of the registered parent XiTransport.pdrain1_xi_forall_parent under the unchanged guarantee ID. This does NOT close A-ABSTRACT-TX. What remains for the exit layout is reachability: nothing here proves the pinned runtime reaches accum_loop, that the gaps its loop body takes are these gaps, or that the words it loads are the queue slots ExitRecordWords.ok describes. The deposit 184-byte MixedStores layout is untouched by this revision. EndpointAgrees, equivalently ExitAgrees, is NOT discharged by this revision. Correction as of the R4 deposit gap-drain revision, superseding the sentence above that says the deposit 184-byte MixedStores layout is untouched: the deposit side is now at the same shape as the exit side. XiTransport.GapMixedStores admits an arbitrary memory-neutral gap before every store, word or byte, supplying only that store's offset and value at that store, and continues from the post-state the store computes (mstorePost, mstore8Post) rather than from an assumed one, so the three things SpacedMixedStores still asked of a caller per store - the state the store lands in, a StepOk witness, and the frame conditions off <= size <= off + 32 (word) and off < size (byte) - are all gone. The frame conditions are the ones that mattered: builder_deposits writes its 184-byte records from a loop of its own, so those were seven assertions per record about the size of memory between two stores of a runtime the caller does not control. XiTransport.SplicesCovered with splicesCovered_byteRun_append, splicesCovered_depositRecord and covered_depositStores recover the frontier arithmetically at the offsets main.eas gives the seven stores - +0, +32, +64 walk the frame out to b + 96, the eight %MSTORE64_le bytes at +80 .. +87 land strictly inside it and none of them moves the frontier, +96, +128, +160 walk it out to b + 192, and the next record's base b + 184 is within one word of that - so XiTransport.GapMixedStores.spaced transports the whole SpacedMixedStores layer onto GapMixedStores with no memory-size hypothesis anywhere in the relation, and XiTransport.endpointAgrees_of_gapDepositDrain_return and exitAgrees_of_gapDepositDrain_return ask only pre.memory.size <= 32 about memory for the whole drain. XiTransport.MixedStores.gap embeds the adjacency-shaped relation with every gap empty, so mixedStores_depositPrefix still inhabits the relation with real MSTORE / MSTORE8 opcodes and nothing proved from MixedStores, or through MixedStores.spaced from SpacedMixedStores, is lost. All nine report only propext, Classical.choice and Quot.sound, carry no native_decide and no project axiom, and are carried as conjuncts of the registered parent XiTransport.pdrain1_xi_forall_parent under the unchanged guarantee ID, whose final type_of% conjunct is untouched, so the one-byte kill-line Eip8282.Tests.PDrain1Mutant still refutes the mutated bytecode exactly as before. This does NOT close A-ABSTRACT-TX. What remains for the deposit layout is exactly what remains for the exit one: nothing here proves the pinned runtime reaches builder_deposits' store loop, that the gaps its loop body takes are these gaps, or that the words it loads are the queue slots DepositRecordWords.ok describes, and the %MSTORE64_le expansion into eight ascending MSTORE8s remains an assumption of depositRecordStores rather than a fact checked against pinned source this repository vendors. EndpointAgrees, equivalently ExitAgrees, is NOT discharged by this revision. R2 already closes the entry-to-endpoint composition beneath the premise, so what remains for the whole user-call layer is exactly the endpoint agreement itself: that Xi on the