      "universal_boundary": "The authoritative boundary is Eip8282.Audit.UniversalBoundary.UniversalXiCorrespondence: every PreCallRepresents, admissible call must produce a XiHalts witness, the same observation as Model.step, and PostStateAgrees at the pinned predeploy. PreCallRepresents accounts for the user call-value transfer before the Xi body executes, requires queueTail + 1 < 2^64 before a user entry, and is ordinary Represents for system calls. AdmissibleCall binds every Model.Step to the same Xi environment; a system step has sender SYSTEM_ADDR, zero wei, calldataNonempty = !c.env.calldata.isEmpty, and fuel guard universalFuelBound = 300000. Its exact open residual is UniversalClosure = TerminationClosure ∧ EndpointClosure. Termination is deliberately outside AdmissibleCall; EndpointClosure includes both ExitAgrees and post-state refinement.",
