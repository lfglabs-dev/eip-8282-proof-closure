fo_prefix_of_depositStores therefore states P-DRAIN-1's complete-Xi observation on the deposit path with no hwords and no hbytes, and XiTransport.pdrain1_xi_returns_fifo_prefix_of_mstores is no longer the only statement covering that path. This does NOT close A-ABSTRACT-TX. The hypotheses that remain are named here and are discharged nowhere in this repository: DepositRecordWords.ok, six scalar word equations and one little-endian byte equation per record, shown satisfiable by XiTransport.exists_depositRecordWords but still assumed of the runtime; ExitRecordWords.ok, the same shape for the 68-byte exit record; hfresh, that the drain begins on an empty memory frame; hlen, that the RETURN length operand is the record stride times the record count; and above all hstores, that the pinned runtime actually performs the MixedStores or OverlapStores run described. No run of the pinned bytecode is proved to reach those store sequences for all inputs. XiTransport.mixedStores_depositPrefix only exhibits the first four stores of one record, and it takes the stack shapes as hypotheses. EndpointAgrees, equivalently ExitAgrees, is NOT discharged by this revision. Correction as of this revision, superseding the sentence above that names hstores as an undischarged hypothesis: for the 68-byte exit layout hstores is no longer a hypothesis. XiTransport.overlapStores_one_of_stack runs one real MSTORE from an explicit operand stack and pins the frame size it leaves behind, XiTransport.overlapStores_exitRecord_step runs one whole exit record at an arbitrary base whose frame is covered to within one word, and XiTransport.overlapStores_exitStores iterates that to every record count, so the OverlapStores run at exitStores is constructed rather than assumed and the coverage invariant is re-established at each 68-byte stride. XiTransport.endpointAgrees_of_exitRun_return and XiTransport.exitAgrees_of_exitRun_return therefore state EndpointAgrees and ExitAgrees for the exit drain with no hstores