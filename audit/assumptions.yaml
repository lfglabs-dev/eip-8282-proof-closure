{
  "schema": "eip-8282-assumptions-v1",
  "certification": {
    "status": "DEV-READY",
    "audit_cert": false,
    "statement": "DEV-READY is development readiness, not AUDIT-CERT. Abstract-model CHECKED does not close the pinned-bytecode layer."
  },
  "assumptions": [
    {
      "id": "A-ABSTRACT-TX",
      "accepted": true,
      "risk": "Success/revert semantics of Model.userCall/systemCall are abstract and are not executable EVM trace semantics. F4 closed CFG dispatch and Corresponds observations, not Ξ ↔ Model.",
      "justification": "Isolates the unproved correspondence between Model.userCall and EvmYul.EVM.Xi. P-SUBMIT-1's ∀ parent is CFG-direct (revert/append/getter/fakeExponential) and must not be read as Ξ computing those functions.",
      "severity": "HIGH",
      "violation_impact": "Any guarantee linked to this premise must be re-evaluated against assembly/bytecode.",
      "validation": "Named in every consuming theorem's metadata. Eip8282.Audit.Correspondence states Corresponds is not Ξ agreement.",
      "removal_path": "Replace with a machine-checked correspondence from Model.userCall/systemCall to EvmYul.EVM.Xi on the pinned runtimes."
    },
    {
      "id": "A-REACHABLE",
      "accepted": true,
      "risk": "The three registered parents are CFG-level ∀ under WellFormed/CallHyp, not under Reachable. WellFormed constrains packed storage (slots 0–3, head ≤ tail) and gas/caller, but does not require the storage image to be reachable from initialDeposit or initialExit via step. Reachable is defined in the abstract model and is not claimed by the CFG parents.",
      "justification": "WellFormed is the bytecode-level analogue of Reachable for the CFG layer. Reachable is a model-level concept that cannot be placed on a CFG parent without first closing A-ABSTRACT-TX (proving Ξ agrees with Model). The specified deployments are initialDeposit and initialExit; Reachable closes under step; WellFormed holds on every reachable storage image.",
      "severity": "MEDIUM",
      "violation_impact": "A theorem about an arbitrary WellFormed storage image that is not reachable from the specified deployment is not a theorem about the predeploys. WellFormed admits images where e.g. excess is astronomically large without having been built up by step.",
      "validation": "Reachable inductive in Eip8282.Audit.Model. WellFormed in Eip8282.Audit.WellFormed. All three parents quantify over WellFormed/CallHyp, not Reachable.",
      "removal_path": "Close A-ABSTRACT-TX first (prove Ξ agrees with Model on well-formed calls), then transport Reachable through the correspondence to derive WellFormed-guarded CFG parents from Reachable-guarded model parents."
    },
    {
      "id": "A-CLASSICAL-CHOICE",
      "accepted": true,
      "risk": "Classical Lean rather than constructive.",
      "justification": "Standard Lean 4 kernel axiom; no project-specific claim rests on computational content of choice.",
      "severity": "LOW",
      "violation_impact": "None for the invariance theorems.",
      "validation": "#print axioms in Eip8282.Audit.Trust.",
      "removal_path": "Not required."
    },
    {
      "id": "A-NATIVE-DECIDE",
      "accepted": true,
      "risk": "The kept Xi trace theorems and the mutant kill-lines are discharged by native_decide, adding one compiler-generated axiom per theorem (<theorem>._native.native_decide.ax_1_1 under Lean 4.31) and with it the Lean compiler and the EVMYulLean interpreter to the trusted base. Scope note: as of EVMYulLean 0ff72b2 this no longer covers the jumpdest tables. D_J_aux is now structurally recursive (fuel = c.size), so deposit_D_J, exit_D_J, depositInit_D_J and exitInit_D_J are closed by decide +kernel, and the validJumps = D_J _ 0 bridges in Eip8282.Audit.Step that the registered forall parents rewrite with are kernel-checked.",
      "justification": "Forced for Xi traces, not chosen: a concrete Xi trace reaches EvmYul.FFI.keccak256 / sha256 / BLAKE2Compress, which are opaque @[extern] constants (EvmYul/FFI/ffi.lean) and therefore irreducible in the kernel by construction, and RLP decoding still goes through partial def separateListRLP / deserializeRLP (EvmYul/Wheels.lean). The alternative is no Xi-level evidence at all. It is no longer forced for D_J, which is why the jumpdest scans were moved off it.",
      "severity": "MEDIUM",
      "violation_impact": "A Lean compiler or EVMYulLean interpreter bug could make the kept Xi trace facts false while the build stays green. The abstract-model theorems, the jumpdest tables and the CFG-level forall parents' D_J rewrites are unaffected.",
      "validation": "#print axioms in Eip8282.Audit.Trust names exactly which theorems carry it, and separately shows deposit_D_J / exit_D_J / depositInit_D_J / exitInit_D_J / deposit_validJumps_eq_D_J / exit_validJumps_eq_D_J carrying only the three foundational axioms; the P-SUBMIT-1 / P-DRAIN-1 / P-CONTROL-1 bytecode kill-lines show the evaluation is discriminating rather than constant-true.",
      "removal_path": "Done for the jumpdest scans (EVMYulLean 0ff72b2 + decide +kernel). For the remaining Xi traces, give keccak256 / sha256 / BLAKE2Compress verified in-Lean models instead of opaque @[extern] constants and make RLP decoding structurally recursive, then the traces become decide-able in principle (cost permitting)."
    },
    {
      "id": "A-EVM-WORLD",
      "accepted": true,
      "risk": "The bytecode layer executes on a synthetic two-account world (predeploy plus caller) with a default block header, not on mainnet state. All three registered parents are CFG-level ∀ under WellFormed / CallHyp — P-SUBMIT-1 WELL_FORMED_FORALL, P-DRAIN-1 CFG_FORALL, P-CONTROL-1 CFG_FORALL — plus the Wave-1/5/6 Ξ traces the kill-lines still refute. They are not finite-trace-only claims and they do not quantify over arbitrary raw storage or mainnet state.",
      "justification": "Xi is the real EVM message-call semantics; only the surrounding world is synthetic. None of the three ∀ parents quantifies over arbitrary raw storage: WellFormed packs slots 0–3 and requires head ≤ tail. The kept Ξ traces are kill-line witnesses at chosen images, not the scope of the registered parents.",
      "severity": "HIGH",
      "violation_impact": "A theorem about an ill-formed storage image, the wrong caller class, or a starved-gas call is not a theorem about the predeploy path the parent names. Kill-line traces still refute mutants of the pinned bytes.",
      "validation": "Eip8282.Audit.Correspondence.CallHyp and Eip8282.Audit.EvmRunner.worldWith / callEnv are the world construction. audit/guarantees.yaml records evm.scope WELL_FORMED_FORALL (P-SUBMIT-1) and CFG_FORALL (P-DRAIN-1, P-CONTROL-1).",
      "removal_path": "Close A-ABSTRACT-TX so the WellFormed ∀ transports to Ξ, or execute against observed mainnet predeploy state."
    },
    {
      "id": "A-PINNED-SOURCE",
      "accepted": true,
      "risk": "Assembly and EIP text are pinned snapshots, not live-deployed bytecode.",
      "justification": "sys-asm@83f9801 and EIPs PR #12120 head b759aae8 are the working references.",
      "severity": "HIGH",
      "violation_impact": "A later sys-asm or EIP revision can invalidate the model.",
      "validation": "audit/artifacts.lock.json sha256 of pinned files.",
      "removal_path": "Add deployed-bytecode observation and keccak identity."
    }
  ]
}
