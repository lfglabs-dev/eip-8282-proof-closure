Quot.sound, carry no native_decide and no project axiom, and are carried as conjuncts of the registered parent XiTransport.pdrain1_xi_forall_parent under the unchanged guarantee ID. This does NOT close A-ABSTRACT-TX. What remains for the exit layout is reachability: nothing here proves the pinned runtime reaches accum_loop, that the gaps its loop body takes are these gaps, or that the words it loads are the queue slots ExitRecordWords.ok describes. The deposit 184-byte MixedStores layout is untouched by this revision. EndpointAgrees, equivalently ExitAgrees, is NOT discharged by this revision. Correction as of the R4 deposit gap-drain revision, superseding the sentence above that says the deposit 184-byte MixedStores layout is untouched: the deposit side is now at the same shape as the exit side. XiTransport.GapMixedStores admits an arbitrary memory-neutral gap before every store, word or byte, supplying only that store's offset and value at that store, and continues from the post-state the store computes (mstorePost, mstore8Post) rather than from an assumed one, so the three things SpacedMixedStores still asked of a caller per store - the state the store lands in, a StepOk witness, and the frame conditions off <= size <= off + 32 (word) and off < size (byte) - are all gone. The frame conditions are the ones that mattered: builder_deposits writes its 184-byte records from a loop of its own, so those were seven assertions per record about the size of memory between two stores of a runtime the caller does not control. XiTransport.SplicesCovered with splicesCovered_byteRun_append, splicesCovered_depositRecord and covered_depositStores recover the frontier arithmetically at the offsets main.eas gives the seven stores - +0, +32, +64 walk the frame out to b + 96, the eight %MSTORE64_le bytes at +80 .. +87 land strictly inside it and none of them moves the frontier, +96, +128, +160 walk it out to b + 192, and the next record's base b + 184 is within one word of that - so X