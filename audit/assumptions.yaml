      "risk": "Success/revert semantics of Model.userCall/systemCall are abstract and are not executable EVM trace semantics. F4 closed CFG dispatch; R4 closes the X to Xi observation layer and the exit-instruction layer unconditionally, and R4 additionally discharges the residual outright on P-SUBMIT-1's inhibited and accepting paths, on P-DRAIN-1's empty-window branch and on P-CONTROL-1's paid fee-getter branch, but the universal endpoint observation proof for every user/system path remains an explicit premise (ExitAgrees, equivalent to the former EndpointAgrees) rather than a proved forall. R4 additionally proves the byte-content half for a single store, spending EVMYulLean PR 9 opcode-path lemmas: the bytes a RETURN publishes out of memory written by a real MSTORE opcode are the model big-endian encoding of the stored word, so EndpointAgrees is proved in conclusion position for the MSTORE(0,v); RETURN(0,32) fragment (endpointAgrees_of_mstore_return_zero), and P-CONTROL-1's Xi transport (pcontrol1_xi_fee_getter_of_mstore) trades thirty-two assumed byte equations for the scalar v.toNat = currentFee model. That reduces the assumption without closing it: reaching that MSTORE/RETURN pair in the pinned runtime is still assumed, and P-DRAIN-1's non-empty window, written by a queue-dependent loop of stores, is not covered. R5 sharpens the storage part rather than closing it: for every ReachableStorage image, Xi on the pinned runtime must realise applyUser/applySystem. Neither ExitAgrees nor that realisation is proved. Correction as of the R4 endpoint work: P-DRAIN-1's non-empty window is now covered in conclusion position for both drain layouts - OverlapStores for the 68-byte exit record and MixedStores for the 184-byte deposit record including the %MSTORE64_le little-endian eight-byte splice - so what the assumption still buys on that path is reachability of the store loop, not the byte content it leaves. Both of those relations required the record's MSTOREs to be adjacent, which the pinned exit runtime never is - builder_exits writes its window from the accum_loop body at PC 247 with the back-jump at PC 300, so the stores at PC 274, 284 and 294 are separated by the SLOAD, the ADD/MUL/SHL/EQ operand arithmetic, the DUP/SWAP/POP shuffling and the JUMPDEST/JUMP/JUMPI that close the loop. That adjacency claim is now removed rather than assumed: NeutralOp names exactly that non-MSTORE opcode set, memory_step_neutral proves each of those opcodes leaves memory alone from the four EVMYulLean opcode-family frames memory_execBinOp, memory_dup, memory_swap and memory_unaryStateOp, memory_Runs_neutral closes it transitively, and SpacedStores admits an arbitrary run between two stores under a syntactic condition on the gap trace. OverlapStores.spaced embeds the adjacency relation with empty gaps, so nothing proved from it is lost and none of the new statements is weaker; endpointAgrees_of_spacedExitStores_return is EndpointAgrees in conclusion position for a loop-written window and pdrain1_xi_returns_fifo_prefix_of_spacedExitStores carries it to the complete-Xi observation. These are carried as new named conjuncts on the unchanged registered parent pdrain1_xi_forall_parent, whose final type_of% conjunct is untouched, so the existing one-byte kill-line Eip8282.Tests.PDrain1Mutant still refutes the mutated bytecode exactly as before. That treatment covered only the exit layout. MixedStores, the deposit-side relation, was still requiring its MSTORE and MSTORE8 splices to be adjacent, and builder_deposits writes its 184-byte records from a loop of its own, so the deposit half of P-DRAIN-1's non-empty window was still stated about a store shape the pinned runtime does not have. SpacedMixedStores removes that requirement on both constructors under the same syntactic NeutralOp gap condition - SpacedMixedStores.nil_neutral, word_neutral and byte_neutral derive the gap's memory equation from memory_Runs_neutral, so a caller asserts nothing about intermediate states - MixedStores.spaced embeds the adjacency relation with empty gaps so nothing proved from it is lost, bytes_memory_SpacedMixedStores recomputes the byte image, and endpointAgrees_of_spacedDepositStores_return, exitAgrees_of_spacedDepositStores_return and pdrain1_xi_returns_fifo_prefix_of_spacedDepositStores put EndpointAgrees and ExitAgrees in conclusion position for a loop-written deposit window at the complete-Xi observation. Both drain layouts are now in that form. These are again carried as new named conjuncts on the unchanged registered parent pdrain1_xi_forall_parent, whose final type_of% conjunct is untouched, so the one-byte kill-line Eip8282.Tests.PDrain1Mutant still refutes the mutated bytecode exactly as before. None of this discharges the assumption: what it removes from the residual is a hypothesis that was false of the pinned runtime, and what remains is unchanged in kind - nothing proves the pinned runtime reaches those stores at all. ExitAgrees remains an explicit premise and this assumption stays OPEN. Correction as of the R4 revert-endpoint work: both pinned runtimes end in the four bytes 5b 5f 5f fd - JUMPDEST; PUSH0; PUSH0; REVERT - which is the revert: label of main.eas that every refusal path jumps to, and deposit_tail_is_revert_subroutine / exit_tail_is_revert_subroutine check that against the pinned byte arrays with decide +kernel rather than assuming it, so neither carries a native_decide receipt. Because the length operand revert: pushes is zero the published slice is empty whatever memory holds, so unlike the drain endpoint no memory reasoning, NeutralOp gap condition or MSTORE accounting enters the argument at all: step_REVERT supplies the REVERT step inversion EvmYul.EVM.Proof.MemoryStep does not ship at the pinned revision, and endpointAgrees_of_revertEpilogue puts EndpointAgrees in conclusion position with the three-step run constructed rather than assumed and with memory, gas, substate and the preceding trace universally quantified. Its two branch instances endpointAgrees_of_revertEpilogue_inhibited and endpointAgrees_of_revertEpilogue_rejected discharge the model half from inhibited and admissible alone, so P-SUBMIT-1's inhibited and rejected paths now have EndpointAgrees as a conclusion. Separately psubmit1_xi_inhibited_reverts_of_zeroTop and psubmit1_xi_rejected_reverts_of_zeroTop narrow the complete-Xi residual from two premises to one: where the _of_zero_length forms took an existentially shaped pop2 on the internal state mid plus a numeric side condition on the popped word, these take the single syntactic fact that the exit state's stack is two zero words followed by a remainder, bridged to mid by Z_ok_stack and shown to be exactly what the subroutine's two PUSH0s leave by zeroTop_push0_push0. This does not discharge the assumption and EndpointAgrees remains OPEN. The gap is now one named thing: nothing proves that a Xi run of a pinned runtime ever reaches the revert: JUMPDEST at offset 624 in the deposit image or 454 in the exit image. endpointAgrees_of_revertEpilogue quantifies over the run and never asserts it is a run of depositRuntime or exitRuntime, and never appeals to decodeAt; the kernel-checked tail facts say the four bytes sit at those offsets, not that any reachable state has pc there or that decodeAt at that pc yields PUSH0. Bridging the byte-offset facts to decodeAt and then proving each jump revert site is taken exactly on the abstract refusal condition is the remaining lemma. All of this is carried under the existing P-SUBMIT-1 ID with no new guarantee or assumption ID and the final type_of% conjunct of psubmit1_xi_forall_parent untouched, so the one-byte kill-line Eip8282.Tests.PSubmit1Mutant still refutes the mutated bytecode exactly as before. EndpointAgrees is NOT discharged. A-ABSTRACT-TX stays OPEN at HIGH. Update as of the R4 revert-path work: the decodeAt bridge named above as the remaining lemma now exists (decodeAt_of_code_pc), and the exit path has been walked backwards three instructions from the assumed endpoint. revert_exit_of_reaches_revertJumpdest builds the four-step revert: subroutine outright, atRevertJumpdest_of_atRevertJumpi derives the landing from one taken JUMPI at one of ten decide+kernel PUSH2 @revert; JUMPI sites, and atRevertJumpi_of_atRevertPush derives both that JUMPI site and its destination operand from the PUSH2 three bytes earlier, whose immediate is read out of the pinned image rather than supplied as a hypothesis, so the exit-side stack premise is now only that the branch condition sits on top. None of that closes the assumption: the ten sites are enumerated and read forwards with no completeness proof, no XRuns prefix landing in AtRevertPush is constructed for either image, and nothing shows the branch is taken exactly on the abstract refusal condition. What remains is reachability of one of the ten sites plus the taken-branch condition. Still carried under the existing P-SUBMIT-1 ID with no new guarantee or assumption ID. EndpointAgrees is NOT discharged. A-ABSTRACT-TX stays OPEN at HIGH. Update as of the R4 branch-completeness and registration work: two things were wrong with what the preceding revisions left. First, every step above walked only the taken edge of the pinned JUMPI @revert sites, which on its own left open that those sites might reach revert: regardless of the condition word. Z_JUMPI_untaken closes that half - EVMYulLean conditions its BadJumpDestination guard on the second stack word being nonzero, so the untaken step needs no validJumps premise at all - step_JUMPI_untaken advances the pc by one rather than jumping, and succ_revertJumpiSite_ne_revertPc settles by decide+kernel over the ten literals that one byte past a site is not the label, the sites all being below offset 205 while revert: sits at 624 and 454. not_atRevertJumpdest_of_atRevertJumpi_untaken is the resulting only-if and atRevertJumpdest_iff_cond_ne_zero states it with the taken direction, so the pinned sites reach the revert: JUMPDEST exactly when the condition word is nonzero and provably not otherwise. Second and more seriously, psubmit1_xi_forall_parent was declared before the revert: sections in the module and therefore could not mention them, so none of the revert-endpoint, decodeAt-bridge, revert-JUMPDEST, JUMPI-site or PUSH2-operand work was a conjunct of the registered parent: it existed in XiTransport but nothing reachable from the P-SUBMIT-1 guarantee ID asserted it. The three parents now sit after those sections and psubmit1_xi_forall_parent carries the chain as named conjuncts - endpointAgrees_of_revertEpilogue with its inhibited and rejected instances, psubmit1_xi_inhibited/rejected_reverts_of_zeroTop, the pinned tail facts, decodeAt_of_code_pc, revertSubroutine_decodes, revert_exit_of_reaches_revertJumpdest, revertJumpi_sites_pinned, atRevertJumpdest_of_atRevertJumpi, atRevertJumpi_of_atRevertPush, the three revert_exit_of_reaches_* forms with their branch instances, and the two new fall-through results. Only the ordering and the conjunct list changed; no statement was weakened or restated, and the final type_of% conjunct is still psubmit1_forall_parent itself, so the one-byte kill-line Eip8282.Tests.PSubmit1Mutant still refutes the mutated bytecode exactly as before. Continuing the R4 endpoint work, one of the ten condition words is no longer opaque. At deposit pc 148 and exit pc 147 the instruction feeding the PUSH2 @revert; JUMPI pair is CALLVALUE, so the word the bytecode branches on is Iv, the wei value of the call, read from the execution environment. valueGuard_pinned settles the opcode and the site membership with decide +kernel over the literals, carrying no native_decide receipt; Z_CALLVALUE/step_CALLVALUE/xStepAt_CALLVALUE supply the step and stack_callvaluePost is the equation that the pushed word is Iv itself; atRevertPush_of_atValueGuard walks the guard into the existing AtRevertPush chain and revert_exit_of_reaches_valueGuard carries it to the REVERT exit with empty return data. On the abstract side Model.userCall on empty calldata reverts exactly when value is nonzero, and psubmit1_exitAgrees_iff_paidGetter turns ExitAgrees into precisely 'the exit op is REVERT and its data is empty' for that clause. psubmit1_xi_paidGetter_reverts_of_reaches_valueGuard composes the two through xiTransport with value defined as Iv.toNat rather than assumed equal to it, and endpointAgrees_of_revertEpilogue_paidGetter states the same clause with EndpointAgrees in conclusion position. All six are named conjuncts of psubmit1_xi_forall_parent, added before the unchanged final psubmit1_forall_parent conjunct, so Eip8282.Tests.PSubmit1Mutant still refutes the mutated bytecode exactly as before. This does not close the assumption: the XRuns prefix reaching the guard is still a hypothesis, the tie is supplied at one of the ten sites against one clause of userCall, and the other nine still branch on words nothing has identified. EndpointAgrees is NOT discharged. A-ABSTRACT-TX stays OPEN at HIGH. Continuing the R4 endpoint work one instruction earlier, a second condition word is identified and the first XRuns prefix reaching a pinned site is constructed. At deposit pc 143 and exit pc 142 the images run a dispatch size guard whose PUSH2 @revert; JUMPI pair at pc 147 / pc 146 is two more of the ten already-pinned sites and whose instruction is CALLDATASIZE, so that word is |I_d|, the size of the call's own calldata. sizeGuard_pinned settles the opcode, the site membership and sizeGuardPc + 5 = valueGuardPc over the literals with decide +kernel and decide, carrying no native_decide receipt, as does succ_sizeGuardJumpi_eq_valueGuardPc; Z_CALLDATASIZE/step_CALLDATASIZE/xStepAt_CALLDATASIZE supply the step and stack_calldatasizePost is the equation that the pushed word is |I_d| itself. revert_exit_of_reaches_sizeGuard is the taken branch: nonempty calldata at the size guard halts at REVERT with empty return data. atValueGuard_of_atSizeGuard is the change of kind: with |I_d| = 0 the branch is not taken and the three iterations CALLDATASIZE, PUSH2 @revert, untaken JUMPI are constructed into an XRuns landing exactly on the nonpayable guard, carrying the stack, the code and Iv through unchanged with the gas fully accounted, so the AtValueGuard premise of the previous increment becomes a conclusion. That run passes through AtRevertPush and AtRevertJumpi, so the earlier record that no XRuns prefix landing in those predicates is constructed for either image is superseded: such a prefix now exists, starting at the size guard. psubmit1_xi_paidGetter_reverts_of_reaches_sizeGuard composes the two guards through xiTransport - a run reaching the size guard with bytes I_d = [] and nonzero Iv produces the observation the model produces for .user caller [] value - so both branch conditions are read from the execution environment rather than assumed, with calldata_size_eq_zero_of_bytes_nil the length-preservation step tying the model's [] argument to |I_d| = 0. All seven are named conjuncts of psubmit1_xi_forall_parent, added before the unchanged final psubmit1_forall_parent conjunct, so Eip8282.Tests.PSubmit1Mutant still refutes the mutated bytecode exactly as before. This does not close the assumption: reaching the size guard is itself a hypothesis, since the dispatch prefix from c.entry to deposit pc 143 / exit pc 142 is not constructed for either image, so no XRuns from c.entry to a pinned site exists end to end; the condition word is identified at two of the ten sites and the other eight still branch on words nothing has identified; and the two identified conditions cover the empty-calldata fee-getter clause of userCall only, leaving the deposit and exit submission clauses - depositWellFormed / exitWellFormed and the fee comparison - untouched. Correction as of the R4 fee-comparison work: the fee comparison is no longer untouched. At deposit pc 161 and exit pc 159 the images run CALLVALUE; LT; PUSH2 @revert; JUMPI, whose JUMPI at deposit 166 / exit 164 is a third pair of the ten already-pinned sites, and feeGuard_pinned settles the opcode at pc, the opcode at pc + 1 and the membership of pc + 5 over the literals with decide +kernel and decide, carrying no native_decide receipt. This is the first of the ten sites whose condition word is a computed comparison rather than a word lifted off the execution environment: Z_LT/step_LT/xStepAt_LT supply the step and stack_ltPost is the equation that LT leaves UInt256.lt Iv req on the stack, so atRevertPush_of_atFeeGuard constructs two X iterations from the guard onto the pinned PUSH2 @revert with the branch condition computed from the wei actually attached to the call rather than assumed - the second XRuns prefix in the module reaching one of the ten sites and the first on the rejected branch. admissible_eq_false_of_lt_requiredWei is the abstract half: requiredWei is the right-hand side of the value conjunct of Model.admissible - depositAmount calldata * gwei + currentFee in the deposit image, currentFee in the exit image - so underpayment refutes admissibility outright in both images with no well-formedness premise. psubmit1_xi_rejected_reverts_of_reaches_feeGuard composes the two halves through xiTransport and removes three assumptions at once from psubmit1_xi_rejected_reverts_of_reaches_revertPush: the pinned PUSH2 @revert is reached rather than assumed, the branch condition is computed rather than assumed, and admissible model calldata value = false is derived from the same underpayment rather than taken as a bare hypothesis. All six are named conjuncts of psubmit1_xi_forall_parent, added before the unchanged final psubmit1_forall_parent conjunct, so Eip8282.Tests.PSubmit1Mutant still refutes the mutated bytecode exactly as before. This does not close the assumption: hreq, the equation that the word the image staged as req is requiredWei model calldata, is a hypothesis and not a step - that word is the output of the fake_exponential loop at offsets 100-126, which this module does not evaluate, so what is proved is that the image reverts when Iv is below the word it staged and only hreq says that word is the fee the model charges; arriving at the fee guard is a hypothesis as before and no XRuns from c.entry exists end to end; six of the ten sites now branch on an identified word and four - deposit 67, 190, 204 and exit 66 - still do not; and the well-formedness half of admissible, the calldata content rather than its length or the value paid, is untouched. R4 then identifies two of those four remaining sites: deposit 67 and exit 66 are the same inhibitor guard in the two images, and it is the one guard whose model side needs no bridging hypothesis at all. Both images open the user subroutine with SLOAD; DUP1; PUSH32 INHIBITOR; EQ; PUSH2 @revert; JUMPI, reading the excess slot and refusing when it holds the inhibitor sentinel, and inhibitGuard_pinned settles the PUSH32 at deposit pc 30 / exit pc 29 together with its 32-byte INHIBITOR immediate, the EQ 33 bytes on and the membership of pc + 37 over the literals with decide +kernel and decide, carrying no native_decide receipt. Z_PUSH32/step_PUSH32/xStepAt_PUSH32 and Z_EQ/step_EQ/xStepAt_EQ supply the two steps, stack_eqPost is the equation that EQ leaves UInt256.eq INHIBITOR excess on the stack, and atRevertPush_of_atInhibitGuard constructs the two X iterations from the guard onto the pinned PUSH2 @revert - the third XRuns prefix in the module reaching one of the ten sites, and the first on the inhibited branch. The abstract half is what distinguishes this from the fee comparison: Model.inhibited is defined as decide (storedExcess = inhibitor) and the PUSH32 immediate is that same inhibitor, so inhibited_iff_storedExcess_eq_inhibitor and eq_inhibitor_bne_zero_of_inhibited derive the taken branch from inhibited model = true itself - the very hypothesis psubmit1_exitAgrees_iff is stated on - rather than from a second word the module must assume something about, so there is no hreq-shaped bridge here. psubmit1_xi_inhibited_reverts_of_reaches_inhibitGuard composes the two halves through xiTransport and removes two assumptions from psubmit1_xi_inhibited_reverts_of_reaches_revertPush: the pinned PUSH2 @revert is reached rather than assumed, and the branch condition is computed rather than assumed. All seven are named conjuncts of psubmit1_xi_forall_parent, added before the unchanged final psubmit1_forall_parent conjunct, so Eip8282.Tests.PSubmit1Mutant still refutes the mutated bytecode exactly as before. This does not close the assumption either: arriving at the inhibitor guard is a hypothesis exactly as arriving at the fee guard is, and no XRuns from c.entry reaches any guard end to end; hexc, the equation that the word SLOAD produced is model.storedExcess, is supplied by Represents at the entry state but is passed in as a hypothesis rather than stepped through the SLOAD; DUP1 pair; hreq is untouched; eight of the ten sites now branch on an identified word and two - deposit 190 and 204 - still do not; and the well-formedness half of admissible is still untouched. EndpointAgrees is NOT discharged. A-ABSTRACT-TX stays OPEN at HIGH.",
      "justification": "Isolates the unproved correspondence between Model.userCall/systemCall and EvmYul.EVM.Xi. The three registered parents remain CFG-direct foralls plus kill-line traces and must not be read as Xi computing those functions. R4 transports those same IDs to complete-Xi observations only under ExitAgrees. R5 proves constructor/call preservation and Model.Reachable entirely on the packed-storage/model side; it never runs Xi and therefore does not discharge ExitAgrees.",
      "severity": "HIGH",
      "violation_impact": "Any guarantee linked to this premise must be re-evaluated against assembly/bytecode. Because A-REACHABLE's residual now folds into this entry, a violation here also invalidates the claim that ReachableStorage describes the images the predeploys can actually reach - the containment proofs would remain true but would be about the wrong closure.",
      "validation": "Named in every consuming theorem's metadata. Eip8282.Audit.Correspondence states Corresponds is not Ξ agreement. Eip8282.Audit.XiTransport carries the assumption explicitly as the premise XiTransport.ExitAgrees: with four exceptions every transported statement in that module takes it as a hypothesis, so a green build there is not evidence that it holds. The first exception is P-SUBMIT-1's inhibited path: XiTransport.psubmit1_exitAgrees_of_zero_length proves ExitAgrees from the exit's own stack operands, so XiTransport.psubmit1_xi_inhibited_reverts_of_zero_length carries no ExitAgrees hypothesis and that branch no longer rests on this assumption. The second is P-DRAIN-1's empty-window branch, new in this revision: Model.systemCall has no revert constructor, so XiTransport.pdrain1_exitAgrees_iff states the drain residual in closed form as op != REVERT together with a byte equation against concatReturned of the capped FIFO window, with no Outcome left in it; XiTransport.pdrain1_xi_exit_not_REVERT reads the REVERT refutation off that iff with no hypothesis at all about the window, the represented kind or the run, and XiTransport.pdrain1_xi_exit_is_RETURN combines it with pdrain1_xi_exit_publishes to pin the drain's exit opcode to exactly one of H's four branches. When the window encodes to nothing, XiTransport.pdrain1_exitAgrees_of_silent and XiTransport.pdrain1_exitAgrees_of_zero_length produce ExitAgrees rather than consume it, so XiTransport.pdrain1_xi_empty_window_returns_nothing is a complete-Xi observation with no ExitAgrees premise. Every other consuming statement still does. XiTransport.endpointAgrees_iff_exitAgrees proves the restated premise is equivalent to the former EndpointAgrees, so that restatement neither strengthens nor weakens what is being assumed. R4 additionally removes the H post.toMachineState op = some out side condition and the universally quantified output ByteArray from every transported statement: XiTransport.exit_halting derives from EvmYul.EVM.Proof.RunUntil.stop_of_rem_pos that a block which stopped with fuel remaining stopped at a halting opcode, and XiTransport.exit_H composes that with H_eq_none_iff to prove H is some at the exit. That is a strict reduction in what a caller must supply - one premise instead of two - but it is not a weakening of the semantic content still assumed, which remains ExitAgrees alone. R4 further proves the width of the published slice rather than leaving it inside the residual: XiTransport.size_readWithPadding shows ByteArray.readWithPadding zero-pads up to the requested length, so XiTransport.length_bytes_haltData pins the number of bytes a RETURN or REVERT publishes to that instruction's own length operand, and XiTransport.xiWidthTransport carries this at complete Xi with no hypothesis beyond the run and the shape of the operand stack. The exact-width equalities carry an explicit machine-word side condition mu1.toNat < USize.size, which is not cosmetic because USize.size is 2 ^ System.Platform.numBits and may be 2 ^ 32; the inequality directions are unconditional. Consequently XiTransport.psubmit1_exitAgrees_iff_operand restates P-SUBMIT-1's residual with no ByteArray left in it, XiTransport.pdrain1_xi_exit_length_ge and pdrain1_xi_exit_length_eq pin P-DRAIN-1's length operand to the width of the FIFO window, and XiTransport.pcontrol1_xi_exit_length_ge_32 and pcontrol1_xi_exit_length_eq_32 sharpen P-CONTROL-1's operand from non-zero to exactly 32. These are carried as new named conjuncts on the unchanged registered parents psubmit1_xi_forall_parent, pdrain1_xi_forall_parent and pcontrol1_xi_forall_parent, whose final type_of% conjunct is untouched so the existing one-byte kill-lines still refute them. None of this discharges the assumption; it removes how much is published from the residual and leaves which bytes. Eip8282.Audit.Reachable states that it never runs Xi; Eip8282.Audit.Trust prints axioms for its closure theorems, and none of those lines may carry a native_decide receipt. This revision also strengthens the registered parent pdrain1_xi_forall_parent in place: the conjunct that previously concluded op = RETURN or op = REVERT on a non-empty window now concludes op = RETURN, and three conjuncts are added carrying the closed-form residual, the unconditional REVERT refutation, and the empty-window complete-Xi observation. The final type_of% conjunct is untouched, so the existing one-byte kill-line Eip8282.Tests.PDrain1Mutant still refutes the mutated bytecode exactly as before. None of the new theorems carries native_decide or a project axiom, and none of them discharges the assumption: what P-DRAIN-1 still owes is which bytes the pinned runtime's RETURN publishes on a non-empty window, and that it reaches that RETURN at all. The third and fourth exceptions are new in this revision, and they belong to the other two parents. For P-SUBMIT-1, the inhibited path was only half the user call: XiTransport.psubmit1_exitAgrees_iff_accepted states the residual on the accepting path - uninhibited, non-empty calldata, admissible - in closed form as op != REVERT together with bytes out = nil, because Model.userCall answers an accepted submission with .success _ nil; XiTransport.psubmit1_xi_accepted_exit_not_REVERT reads the REVERT refutation off that iff with no hypothesis about the run at all, and XiTransport.psubmit1_exitAgrees_of_silent_accepted and psubmit1_exitAgrees_of_zero_length_accepted produce ExitAgrees rather than consume it, so XiTransport.psubmit1_xi_accepted_returns_nothing observes the complete Xi call succeeding with no data under no ExitAgrees premise. For P-CONTROL-1, XiTransport.pcontrol1_exitAgrees_iff states the fee getter's residual in closed form as op != REVERT together with bytes out = toBeBytes (currentFee model) 32, with no Outcome left in it, so XiTransport.pcontrol1_xi_exit_not_REVERT drops the H post.toMachineState op = some out side condition that pcontrol1_xi_exit_is_RETURN needed; and the fee getter is proved non-payable: an empty-calldata call carrying value is refused by Model.userCall before the quote is computed, so XiTransport.pcontrol1_exitAgrees_iff_paid gives that branch the same pure EVM-side residual as P-SUBMIT-1's inhibited path, XiTransport.pcontrol1_xi_paid_exit_is_REVERT pins its exit opcode with no hypothesis about H or memory, and XiTransport.pcontrol1_xi_paid_fee_getter_reverts_of_zero_length observes the complete Xi call reverting with no data under no ExitAgrees premise. This revision also strengthens psubmit1_xi_forall_parent and pcontrol1_xi_forall_parent in place, by adding conjuncts carrying those closed forms and complete-Xi observations; in both the final type_of% conjunct is untouched, so the existing one-byte kill-lines Eip8282.Tests.PSubmit1Mutant and Eip8282.Tests.PControl1Mutant still refute the mutated bytecode exactly as before. None of the new theorems carries native_decide or a project axiom, and none of them discharges the assumption: what P-SUBMIT-1 still owes is that the pinned runtime reaches the exit its abstract counterpart predicts on each branch, what P-CONTROL-1 still owes is which 32 bytes of memory the fee getter's RETURN publishes, and A-ABSTRACT-TX stays OPEN at HIGH. This revision closes the last Model.userCall branch that had never been touched and makes the branch count exact. XiTransport.psubmit1_exitAgrees_iff_rejected states the rejected-submission residual - uninhibited, non-empty calldata, admissible false - in closed form as op = REVERT together with bytes out = nil, with no Outcome left in it; XiTransport.psubmit1_xi_rejected_exit_is_REVERT reads the opcode off that iff with no hypothesis about H or memory; and XiTransport.psubmit1_exitAgrees_of_zero_length_rejected produces ExitAgrees rather than consuming it, so XiTransport.psubmit1_xi_rejected_reverts_of_zero_length observes the complete Xi call reverting with no data under no ExitAgrees premise. That is the fifth and last exception