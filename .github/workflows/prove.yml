name: prove

on:
  push:
    branches: [main]
  pull_request:

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-mathlib-cache: true
      # Full check keeps candidate proofs and every regression in CI while
      # `make prove` is the smaller registered-correctness build for auditors.
      - name: Core, candidates, kill-lines and metadata
        run: make check
